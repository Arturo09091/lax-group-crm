<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo, useContext } = React;

/* ═══════════════════════ ERROR BOUNDARY ═════════════════════════ */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) return (
      <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6">
        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-sm w-full text-center">
          <div className="text-4xl mb-4">⚠️</div>
          <h2 className="text-white font-bold text-lg mb-2">Algo salió mal</h2>
          <p className="text-slate-400 text-sm mb-6">Hubo un error al cargar la aplicación. Intentá recargar la página.</p>
          <button onClick={() => window.location.reload()}
            className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm transition-all">
            🔄 Recargar
          </button>
        </div>
      </div>
    );
    return this.props.children;
  }
}

/* ═══════════════════════════ CONSTANTS ═══════════════════════════ */

/* Etapas por defecto. Son solo el punto de partida y el respaldo mientras el
   servidor responde: cada cliente puede tener N columnas propias.
   Los ids 'new', 'converted' y 'lost' son del sistema (renombrables y
   reordenables, no borrables): sostienen la entrada de leads y las métricas. */
const DEFAULT_STAGES = [
  { id:'new',       label:'Nuevo Lead',        position:0, color:'#3b82f6', isWon:false, isLost:false, isEntry:true  },
  { id:'contacted', label:'Contactado',        position:1, color:'#eab308', isWon:false, isLost:false, isEntry:false },
  { id:'following', label:'En Seguimiento',    position:2, color:'#f97316', isWon:false, isLost:false, isEntry:false },
  { id:'proposal',  label:'Propuesta Enviada', position:3, color:'#a855f7', isWon:false, isLost:false, isEntry:false },
  { id:'converted', label:'Convertido',        position:4, color:'#22c55e', isWon:true,  isLost:false, isEntry:false },
  { id:'lost',      label:'Perdido',           position:5, color:'#ef4444', isWon:false, isLost:true,  isEntry:false },
];
const PROTECTED_STAGE_IDS = ['new', 'converted', 'lost'];

/* Color por etapa en estilo EN LÍNEA (hex), no clases de Tailwind: el build de
   navegador no genera clases construidas al vuelo (bg-${color}-100), así que
   una columna creada por el usuario se quedaría sin estilo. */
const hexA = (hex, a) => {
  const h = /^#[0-9a-fA-F]{6}$/.test(hex || '') ? hex : '#64748b';
  const n = parseInt(h.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
};
// Versión aclarada del color (mezcla con blanco) para que se lea sobre fondo
// oscuro: un #0000ff sobre negro es ilegible, un #7d8cff se lee perfectamente.
const lighten = (hex, amt) => {
  const h = /^#[0-9a-fA-F]{6}$/.test(hex || '') ? hex : '#64748b';
  const n = parseInt(h.slice(1), 16);
  const mix = v => Math.round(v + (255 - v) * amt);
  return `rgb(${mix((n >> 16) & 255)}, ${mix((n >> 8) & 255)}, ${mix(n & 255)})`;
};
/* Se emiten AMBAS versiones como variables CSS y el modo oscuro elige la clara.
   Así el color correcto se aplica al instante al cambiar de tema, sin depender
   de que el componente se vuelva a renderizar. */
const darken = (hex, amt) => {
  const h = /^#[0-9a-fA-F]{6}$/.test(hex || '') ? hex : '#64748b';
  const n = parseInt(h.slice(1), 16);
  const mix = v => Math.round(v * (1 - amt));
  return `rgb(${mix((n >> 16) & 255)}, ${mix((n >> 8) & 255)}, ${mix(n & 255)})`;
};
const pillStyle = c => ({

  '--pc-lite': lighten(c, 0.55),  // texto en modo oscuro
  '--pc-bg': hexA(c, 0.14), '--pc-bg-dark': hexA(c, 0.24),
  backgroundColor: 'var(--pc-bg)', color: 'var(--pc-dark)', borderColor: hexA(c, 0.38),
});

/* Contexto de etapas: las etapas llegan del servidor DESPUÉS del primer render
   y cambian en caliente al guardar, así que tienen que vivir en estado de React
   (una variable de módulo no dispararía el repintado). */
const StagesCtx = React.createContext(null);
const useStages = () => useContext(StagesCtx) || buildStagesCtx(DEFAULT_STAGES);

function buildStagesCtx(stages, save) {
  const list    = Array.isArray(stages) && stages.length ? stages : DEFAULT_STAGES;
  const byId    = Object.fromEntries(list.map(s => [s.id, s]));
  const wonIds  = list.filter(s => s.isWon).map(s => s.id);
  const lostIds = list.filter(s => s.isLost).map(s => s.id);
  const closed  = new Set([...wonIds, ...lostIds]);
  const entry   = list.find(s => s.isEntry) || list[0];
  return {
    stages: list, byId, wonIds, lostIds,
    entryId:  entry ? entry.id : 'new',
    isClosed: id => closed.has(id),
    isWon:    id => wonIds.includes(id),
    isLost:   id => lostIds.includes(id),
    label:    id => (byId[id] ? byId[id].label : id),
    color:    id => (byId[id] ? byId[id].color : '#64748b'),
    save,
  };
}

/* Fecha local (NO UTC): con toISOString, entre las 00:00 y las 02:00 en España

const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayISO = () => isoLocal(new Date());
const addDays  = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return isoLocal(new Date(y, m - 1, d + n)); };
const dayCount = (a, b) => Math.round((Date.parse(b + 'T00:00:00') - Date.parse(a + 'T00:00:00')) / 86400000) + 1;
const mondayOf = iso => { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); return addDays(iso, -((dt.getDay() + 6) % 7)); };
const startOfMonth = iso => iso.slice(0, 7) + '-01';
const endOfMonth   = iso => { const [y, m] = iso.split('-').map(Number); return isoLocal(new Date(y, m, 0)); };
const uid      = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function Icon({ name, size = 18, strokeWidth = 2, className = '' }) {
  return (
    <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      style={{ display: 'block', flexShrink: 0 }} aria-hidden="true">
      {ICON_PATHS[name] || null}
    </svg>
  );
}

function StagePill({ stageId, sm }) {
  const { byId } = useStages();
  const s = byId[stageId];
  // Si la etapa ya no existe NO mentimos diciendo "Nuevo Lead": se marca como
  // desconocida para que el lead se pueda localizar y recolocar.
  const style = s ? pillStyle(s.color) : pillStyle('#94a3b8');
  return (
    <span style={style}
      className={`inline-flex items-center border rounded-full font-medium whitespace-nowrap
      ${sm ? 'text-xs px-2 py-0.5' : 'text-sm px-3 py-1'}`}>
      {s ? s.label : `⚠ ${stageId || 'Sin etapa'}`}
    </span>
  );
}

function Toast({ msg, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, []);
  const bg = { success:'bg-emerald-600', error:'bg-red-600', info:'bg-indigo-600' }[type] || 'bg-indigo-600';
  const icon = { success:'✓', error:'✗', info:'ℹ' }[type] || 'ℹ';
  return (
    <div className={`anim-toast fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3 rounded-xl text-white shadow-2xl ${bg}`}>
      <span className="text-lg font-bold">{icon}</span>
      <span className="text-sm font-medium">{msg}</span>
      <button onClick={onClose} className="ml-2 opacity-70 hover:opacity-100 text-lg leading-none">✕</button>
    </div>
  );
}

// Normaliza un teléfono a solo dígitos con prefijo internacional.
// España por defecto: un móvil/fijo de 9 cifras (6/7/8/9...) recibe el 34.
function waDigits(raw) {
  let d = (raw || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);                  // 0034… → 34…
  if (d.length === 9 && /^[6789]/.test(d)) d = '34' + d;   // ES sin prefijo
  return d;
}

const DEFAULT_WA_TEMPLATE = 'Hola {nombre}, te contactamos por tu consulta. ¿Cómo estás?';
function ContactBtns({ lead, template, waApp }) {
  const digits = waDigits(lead.phone);
  const tpl    = (template && template.trim()) || DEFAULT_WA_TEMPLATE;
  const waMsg  = encodeURIComponent(tpl.replace(/\{nombre\}/gi, lead.name || ''));
  // Enlace de WhatsApp según la app elegida por el admin para esta cuenta.
  // 'normal' → wa.me (comportamiento de siempre, abre la app por defecto).
  // 'business' → en Android abre WhatsApp Business (com.whatsapp.w4b) directo,
  //   con vuelta a wa.me si no está instalada. En iOS/escritorio no se puede
  //   forzar desde el navegador, así que abre la app por defecto (wa.me).
  const waFallback = `https://wa.me/${digits}?text=${waMsg}`;
  const waHref = (waApp === 'business' && typeof navigator !== 'undefined' && /android/i.test(navigator.userAgent))
    ? `intent://send?phone=${digits}&text=${waMsg}#Intent;scheme=whatsapp;package=com.whatsapp.w4b;S.browser_fallback_url=${encodeURIComponent(waFallback)};end`
    : waFallback;
  // Objetivos de toque de 40px (cómodos en móvil). data-contact + stopPropagation
  // garantizan que tocar el botón NUNCA abra la ficha del lead.
  const btn    = 'w-10 h-10 flex items-center justify-center rounded-lg transition-colors flex-shrink-0';
  const stop   = e => e.stopPropagation();
  return (
    <div className="flex gap-1.5" style={{ touchAction: 'manipulation' }} onClick={stop}>
      {digits && (
        <a href={waHref} target="_blank" rel="noopener noreferrer"
           data-contact="1" onClick={stop}
           title="WhatsApp" aria-label="Enviar WhatsApp"
           className={`${btn} bg-emerald-50 hover:bg-emerald-100 active:bg-emerald-200 text-emerald-600`}>
          <Icon name="whatsapp" size={19} />
        </a>
      )}
      {digits && (
        <a href={`tel:+${digits}`} data-contact="1" onClick={stop} title="Llamar" aria-label="Llamar"
           className={`${btn} bg-blue-50 hover:bg-blue-100 active:bg-blue-200 text-blue-600`}>
          <Icon name="phone" size={19} />
        </a>
      )}
      {lead.email && (
        <a href={`mailto:${lead.email}?subject=Consulta`} data-contact="1" onClick={stop}
           title="Email" aria-label="Enviar email"
           className={`${btn} bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-600`}>
          <Icon name="mail" size={19} />
        </a>
      )}
    </div>
  );
}

function Avatar({ name, size = 'md' }) {
  const sz = size === 'sm' ? 'w-7 h-7 text-xs' : 'w-9 h-9 text-sm';
  return (
    <div className={`${sz} rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold flex-shrink-0`}>
      {(name || '?').charAt(0).toUpperCase()}
    </div>
  );
}

function LeadModal({ lead, onSave, onClose }) {

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const handleSubmit = e => {
    e.preventDefault();
    if (!form.name.trim()) return;
    onSave({ ...form, id: form.id || uid() });
  };

  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/50 backdrop-blur-sm" onClick={onClose}>
      <div className="bg-white w-full max-w-2xl mx-4 rounded-2xl shadow-2xl anim-fade max-h-[92vh] overflow-y-auto"
           onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between px-6 py-5 border-b sticky top-0 bg-white z-10">
          <h2 className="text-lg font-bold text-slate-800">
            {isNew ? '➕ Agregar Nuevo Lead' : `✏️ Editar — ${lead.name}`}

          <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-2xl leading-none w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 transition-colors">✕</button>
        </div>

        <form onSubmit={handleSubmit} className="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
          <Field label="Nombre completo *" span>
            <input required value={form.name} onChange={e => set('name', e.target.value)}
              className={inputCls} placeholder="Ej: María García" />
          </Field>

          <Field label="Teléfono / WhatsApp">
            <input value={form.phone} onChange={e => set('phone', e.target.value)}
              className={inputCls} placeholder="5491100000000" />
          </Field>

          <Field label="Email">
            <input type="email" value={form.email} onChange={e => set('email', e.target.value)}
              className={inputCls} placeholder="email@ejemplo.com" />
          </Field>

          <Field label="Fuente">
            <select value={form.source} onChange={e => set('source', e.target.value)} className={inputCls}>
              {SOURCES.map(s => <option key={s}>{s}</option>)}
            </select>
          </Field>

          <Field label="Campaña">
            <input value={form.campaign} onChange={e => set('campaign', e.target.value)}

            <input value={form.adName || ''} onChange={e => set('adName', e.target.value)}
              className={inputCls} placeholder="Nombre del anuncio (UTM)" />
          </Field>

          <Field label="Valor potencial (€)">
            <input type="number" min="0" value={form.value} onChange={e => set('value', e.target.value)}
              className={inputCls} placeholder="0" />
          </Field>

          <Field label="Etapa del pipeline">
            <select value={form.stage} onChange={e => set('stage', e.target.value)} className={inputCls}>
              {/* Si el lead está en una etapa que ya no existe, la mostramos
                  deshabilitada para no reasignarlo sin querer al guardar. */}
              {form.stage && !byId[form.stage] && (
                <option value={form.stage} disabled>⚠ Etapa desconocida: {form.stage}</option>
              )}
              {stages.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}

/* ═══════════════════════════ DASHBOARD ══════════════════════════ */

function Dashboard({ leads, onEdit, onOpenNew, goTo }) {
  const { stages, byId, isClosed, isWon, isLost } = useStages();
  const total     = leads.length;
  const converted = leads.filter(l => isWon(l.stage)).length;
  const active    = leads.filter(l => !isClosed(l.stage)).length;
  const convRate  = total ? Math.round(converted / total * 100) : 0;
  const potVal    = leads.filter(l => !isLost(l.stage)).reduce((s, l) => s + (+l.value || 0), 0);

  const overdueLeads = leads.filter(l => isOverdue(l.followUpDate) && !isClosed(l.stage));
  const todayLeads   = leads.filter(l => isToday(l.followUpDate)   && !isClosed(l.stage));
  // (a.createdAt||'') — un lead sin fecha de alta tumbaba el Dashboard entero
  const recent       = [...leads].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')).slice(0, 6);
  const stageCounts  = Object.fromEntries(stages.map(s => [s.id, leads.filter(l => l.stage === s.id).length]));
  const orphanCount  = leads.filter(l => !byId[l.stage]).length;

  return (
    <div className="p-4 sm:p-6 space-y-4 sm:space-y-6 anim-fade">
      {/* Header */}
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-2xl font-bold text-slate-800">Dashboard</h1>
          <p className="text-sm text-slate-500 mt-0.5">{fmtDate(todayISO())} — Resumen de tu pipeline</p>
        </div>
        <button onClick={onOpenNew}
          className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-colors shadow-sm flex items-center gap-1.5">
          <Icon name="plus" size={16} /> Nuevo lead
        </button>
      </div>

      {/* Overdue alert */}
      {overdueLeads.length > 0 && (
        <div className="bg-red-50 border border-red-200 rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:bg-red-100 transition-colors"
             onClick={() => goTo('reminders')}>
          <span className="text-red-600 flex-shrink-0"><Icon name="alert" size={22} /></span>
          <div>
            <span className="font-semibold text-red-700">
              {overdueLeads.length} lead{overdueLeads.length !== 1 ? 's' : ''} con seguimiento vencido
            </span>
            <span className="text-red-600 text-sm"> — haz clic para ver →</span>
          </div>
        </div>
      )}

      {/* Stats cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {[
          { label:'Total leads',     value: total,                             sub:'registrados',              icon:'users' },
          { label:'En pipeline',     value: active,                            sub:'activos en proceso',       icon:'pipeline' },
          { label:'Conversión',      value: `${convRate}%`,                    sub:`${converted} convertidos`, icon:'target' },
          { label:'Valor potencial', value: potVal ? fmtMoney(potVal) : '0 €', sub:'suma pipeline activo',     icon:'euro' },
        ].map(({ label, value, sub, icon }) => (
          <div key={label} className="rounded-xl p-5 border border-slate-200 bg-white">
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs font-semibold uppercase tracking-wide text-slate-400">{label}</span>
              <span className="text-indigo-600"><Icon name={icon} size={18} /></span>
            </div>
            <div className="text-2xl font-bold text-slate-800">{value}</div>
            <div className="text-xs text-slate-400 mt-0.5">{sub}</div>
          </div>
        ))}
      </div>

      <div className="grid lg:grid-cols-5 gap-4">
        {/* Pipeline bars */}
        <div className="lg:col-span-3 bg-white border rounded-xl p-5">
          <h3 className="font-semibold text-slate-700 mb-4">Leads por Etapa</h3>
          <div className="space-y-3.5">
            {stages.map(s => {
              const count = stageCounts[s.id] || 0;
              const pct   = total ? Math.round(count / total * 100) : 0;
              return (
                <div key={s.id} className="flex items-center gap-3">
                  <span className="text-xs text-slate-500 w-36 truncate">{s.label}</span>
                  <div className="flex-1 bg-slate-100 rounded-full h-2 overflow-hidden">
                    <div className="h-full rounded-full transition-all duration-700"
                      style={{ ...barStyle(s.color), width: `${pct}%` }} />
                  </div>
                  <span className="text-xs font-semibold text-slate-600 w-14 text-right">{count} ({pct}%)</span>
                </div>
              );
            })}
            {/* Leads cuya etapa ya no existe: si no se listaran, los porcentajes no sumarían 100 */}
            {orphanCount > 0 && (
              <div className="flex items-center gap-3">
                <span className="text-xs text-amber-600 w-36 truncate font-medium">⚠ Sin etapa</span>
                <div className="flex-1 bg-slate-100 rounded-full h-2 overflow-hidden">
                  <div className="h-full rounded-full transition-all duration-700"
                    style={{ ...barStyle('#94a3b8'), width: `${total ? Math.round(orphanCount / total * 100) : 0}%` }} />
                </div>
                <span className="text-xs font-semibold text-slate-600 w-14 text-right">{orphanCount}</span>
              </div>
            )}
          </div>
        </div>

        {/* Reminders panel */}
        <div className="lg:col-span-2 bg-white border rounded-xl p-5">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-semibold text-slate-700">Recordatorios</h3>
            <button onClick={() => goTo('reminders')} className="text-xs text-indigo-600 hover:underline">Ver todos →</button>
          </div>
          {overdueLeads.length === 0 && todayLeads.length === 0 ? (
            <div className="flex flex-col items-center py-6 text-slate-400 text-sm">
              <span className="text-emerald-500 mb-2"><Icon name="check" size={26} /></span>
              Sin recordatorios pendientes
            </div>
          ) : (
            <div className="space-y-2">
              {[...overdueLeads, ...todayLeads].slice(0, 5).map(l => (
                <div key={l.id} onClick={() => onEdit(l)}
                  className={`flex items-center gap-3 p-2.5 rounded-lg cursor-pointer hover:shadow-sm transition-all
                    ${isOverdue(l.followUpDate) ? 'bg-red-50 border border-red-100' : 'bg-amber-50 border border-amber-100'}`}>
                  <span className={`flex-shrink-0 ${isOverdue(l.followUpDate) ? 'text-red-500' : 'text-amber-500'}`}><Icon name={isOverdue(l.followUpDate) ? 'alert' : 'calendar'} size={17} /></span>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-medium text-slate-700 truncate">{l.name}</div>
                    <div className={`text-xs ${isOverdue(l.followUpDate) ? 'text-red-500' : 'text-amber-600'}`}>
                      {isOverdue(l.followUpDate) ? `Vencido — ${fmtDate(l.followUpDate)}` : 'Contactar hoy'}
                    </div>
                  </div>
                  <StagePill stageId={l.stage} sm />
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Recent leads */}
      <div className="bg-white border rounded-xl p-5">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-slate-700">Leads Recientes</h3>
          <button onClick={() => goTo('leads')} className="text-xs text-indigo-600 hover:underline">Ver todos →</button>
        </div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">
          {recent.map(l => (
            <div key={l.id} onClick={() => onEdit(l)}
              className="flex items-center gap-3 p-3 rounded-lg hover:bg-slate-50 cursor-pointer transition-colors border border-slate-100">
              <Avatar name={l.name} />
              <div className="flex-1 min-w-0">
                <div className="text-sm font-medium text-slate-800 truncate">{l.name}</div>
                <div className="text-xs text-slate-400 truncate">{l.campaign || l.source}</div>
              </div>
              <StagePill stageId={l.stage} sm />
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

  // followUpDate
  followupdate:'followUpDate', 'próx. contacto':'followUpDate', 'prox. contacto':'followUpDate',
  'próximo contacto':'followUpDate', 'proximo contacto':'followUpDate',
  // notes
  notes:'notes', notas:'notes', nota:'notes',
};

function parseCSV(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];

  // Parse a single CSV line respecting quoted fields
  const parseLine = line => {
    const result = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    result.push(cur.trim());
    return result;
  };

  const headers = parseLine(lines[0]).map(h => h.toLowerCase().replace(/^"|"$/g, ''));
  const colMap  = headers.map(h => CSV_COL_MAP[h] || null);

  return lines.slice(1).map(line => {
    const vals = parseLine(line);
    const obj  = {};
    colMap.forEach((field, i) => { if (field) obj[field] = (vals[i] || '').replace(/^"|"$/g, ''); });
    return obj;
  }).filter(r => r.name);
}

function CSVImportModal({ onImport, onClose }) {
  const { stages, entryId, label } = useStages();

  const [filename, setFilename] = useState('');
  const [error,    setError]    = useState('');
  const fileRef = useRef();

  const handleFile = e => {
    const file = e.target.files[0];
    if (!file) return;
    setFilename(file.name);
    const reader = new FileReader();
    reader.onload = ev => {
      const parsed = parseCSV(ev.target.result);
      if (parsed.length === 0) { setError('No se encontraron leads válidos. Asegurate de que el CSV tenga una columna "name" o "nombre".'); return; }
      setError('');
      setRows(parsed);
      setStep('preview');
    };
    reader.readAsText(file, 'UTF-8');
  };

  const confirm = () => onImport(rows);

  const PREVIEW_FIELDS = ['name','phone','email','source','stage'];
  const PREVIEW_LABELS = { name:'Nombre', phone:'Teléfono', email:'Email', source:'Fuente', stage:'Etapa' };

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>

              <div className="text-5xl">📂</div>
              <p className="text-slate-600 font-semibold group-hover:text-indigo-600">Haz clic para seleccionar tu archivo CSV</p>
              <p className="text-xs text-slate-400">O arrastrá el archivo aquí</p>
            </div>
            <input ref={fileRef} type="file" accept=".csv,text/csv" className="hidden" onChange={handleFile} />
            {error && <p className="text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl px-4 py-2 w-full">{error}</p>}

            {/* Format hint */}
            <div className="w-full bg-slate-50 rounded-xl p-4 text-xs text-slate-500">

              <code className="block text-slate-500 overflow-x-auto whitespace-nowrap">nombre, teléfono, email, fuente, campaña, etapa, valor, notas</code>
              <p className="mt-2">También acepta el formato exportado por este sistema.</p>
            </div>
          </div>
        )}

        {step === 'preview' && (
          <>
            <div className="p-4 border-b bg-slate-50 flex items-center justify-between">
              <span className="text-sm text-slate-600">
                <span className="font-bold text-slate-800">{rows.length}</span> leads encontrados en <span className="font-medium">{filename}</span>
              </span>
              <button onClick={() => { setStep('upload'); setRows([]); setFilename(''); }} className="text-xs text-slate-400 hover:text-slate-600 underline">Cambiar archivo</button>
            </div>
            <div className="overflow-auto flex-1">
              <table className="w-full text-sm">
                <thead className="sticky top-0 bg-white border-b">
                  <tr>
                    {PREVIEW_FIELDS.map(f => (
                      <th key={f} className="text-left px-4 py-2.5 text-xs font-semibold text-slate-500 uppercase tracking-wide">{PREVIEW_LABELS[f]}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {rows.slice(0, 50).map((r, i) => (
                    <tr key={i} className="hover:bg-slate-50">
                      <td className="px-4 py-2 font-medium text-slate-800">{r.name || '—'}</td>

function LeadsView({ leads, onEdit, onDelete, onStageChange, onImport, showToast, waTemplate, waApp }) {
  const { stages, byId, isClosed } = useStages();
  const [search,      setSearch]      = useState('');
  const [filterStage, setFilterStage] = useState('all');
  const [filterSrc,   setFilterSrc]   = useState('all');
  const [sortCol,     setSortCol]     = useState('createdAt');
  const [sortDir,     setSortDir]     = useState('desc');
  const [showImport,  setShowImport]  = useState(false);
  const [visibleCount, setVisibleCount] = useState(50); // paginación incremental "Ver más"

  const handleImportDone = rows => { onImport(rows); setShowImport(false); };

  // Al cambiar búsqueda/filtros/orden, volvemos a mostrar solo los primeros 50.
  useEffect(() => { setVisibleCount(50); }, [search, filterStage, filterSrc, sortCol, sortDir]);

  const toggleSort = col => {
    if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortCol(col); setSortDir('desc'); }
  };

  const filtered = useMemo(() => leads
    .filter(l => filterStage === 'all' ? true
               : filterStage === '__orphan__' ? !byId[l.stage]
               : l.stage === filterStage)
    .filter(l => filterSrc   === 'all' || l.source === filterSrc)
    .filter(l => {
      if (!search) return true;
      const q = search.toLowerCase();
      return [l.name, l.email, l.phone, l.campaign, l.source, l.adSet, l.adName].some(v => (v || '').toLowerCase().includes(q));
    })
    .sort((a, b) => {
      let va = a[sortCol] ?? '', vb = b[sortCol] ?? '';
      if (sortCol === 'value') { va = +va; vb = +vb; }
      const c = va < vb ? -1 : va > vb ? 1 : 0;
      return sortDir === 'asc' ? c : -c;
    }), [leads, filterStage, filterSrc, search, sortCol, sortDir, byId]);

  const exportCSV = () => {
    const cols  = ['name','phone','email','source','campaign','adSet','adName','stage','value','createdAt','followUpDate','notes'];
    const heads = ['Nombre','Teléfono','Email','Fuente','Campaña','Ad Set','Anuncio','Etapa','Valor','Fecha entrada','Próx. contacto','Notas'];
    const rows  = filtered.map(l => cols.map(c => `"${(l[c]||'').toString().replace(/"/g,'""')}"`).join(','));
    const csv   = [heads.join(','), ...rows].join('\n');
    const a     = document.createElement('a');
    a.href      = 'data:text/csv;charset=utf-8,' + encodeURIComponent('\uFEFF' + csv);
    a.download  = `leads_${todayISO()}.csv`;
    a.click();
    showToast('CSV exportado correctamente', 'success');
  };

  const Th = ({ col, children }) => (
    <th onClick={() => toggleSort(col)}
      className="text-left px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide cursor-pointer hover:text-slate-700 select-none whitespace-nowrap">
      {children} {sortCol === col ? (sortDir === 'asc' ? '↑' : '↓') : <span className="opacity-25">↕</span>}
    </th>
  );

  return (
    <div className="p-4 sm:p-6 anim-fade">
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <div>
          <h1 className="text-2xl font-bold text-slate-800">Todos los Leads</h1>
          <p className="text-sm text-slate-500 mt-0.5">
            {filtered.length} lead{filtered.length !== 1 ? 's' : ''}
            {filtered.length !== leads.length ? ` de ${leads.length}` : ''}
          </p>
        </div>
        <div className="flex gap-2 flex-wrap">
          <button onClick={exportCSV}
            className="border border-slate-200 bg-white hover:bg-slate-50 px-4 py-2 rounded-xl text-sm font-medium text-slate-600 transition-colors">
            ↓ Exportar CSV
          </button>
          <button onClick={() => setShowImport(true)}
            className="border border-indigo-200 bg-indigo-50 hover:bg-indigo-100 px-4 py-2 rounded-xl text-sm font-medium text-indigo-600 transition-colors">
            ↑ Importar CSV
          </button>
          <button onClick={() => onEdit(null)}
            className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition-colors shadow-sm flex items-center gap-1.5">
            <Icon name="plus" size={16} /> Nuevo lead
          </button>
        </div>
      </div>

      {showImport && <CSVImportModal onImport={handleImportDone} onClose={() => setShowImport(false)} />}

      {/* Filters */}
      <div className="flex flex-wrap gap-2.5 mb-4">
        <input value={search} onChange={e => setSearch(e.target.value)}
          placeholder="Buscar nombre, email, teléfono, campaña…"
          className="border border-slate-200 bg-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 min-w-72" />
        <select value={filterStage} onChange={e => setFilterStage(e.target.value)}
          className="border border-slate-200 bg-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <option value="all">Todas las etapas</option>
          {stages.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
          {leads.some(l => !byId[l.stage]) && <option value="__orphan__">⚠ Sin etapa</option>}
        </select>
        <select value={filterSrc} onChange={e => setFilterSrc(e.target.value)}
          className="border border-slate-200 bg-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <option value="all">Todas las fuentes</option>
          {SOURCES.map(s => <option key={s}>{s}</option>)}
        </select>
      </div>

      <div className="bg-white rounded-xl border overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm min-w-[640px]">
            <thead>
              <tr className="bg-slate-50 border-b">
                <Th col="name">Nombre</Th>
                <Th col="source">Fuente</Th>
                <Th col="campaign">Campaña</Th>
                <Th col="stage">Etapa</Th>
                <Th col="value">Valor</Th>
                <Th col="followUpDate">Próx. Contacto</Th>
                <th className="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide text-center">Contactar</th>
                <th className="w-8"></th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {filtered.length === 0 ? (
                <tr><td colSpan={8} className="py-16 text-slate-400">
                  <div className="flex flex-col items-center">
                    <span className="text-slate-300 mb-2"><Icon name="search" size={32} /></span>
                    No se encontraron leads
                  </div>
                </td></tr>
              ) : filtered.slice(0, visibleCount).map(l => {
                const over  = isOverdue(l.followUpDate) && !isClosed(l.stage);
                const tod   = isToday(l.followUpDate)   && !isClosed(l.stage);
                return (
                  <tr key={l.id} onClick={(e) => { if (e.target.closest('a, button')) return; onEdit(l); }}
                    className="hover:bg-slate-50 cursor-pointer transition-colors">
                    <td className="px-4 py-3">
                      <div className="flex items-center gap-2.5">
                        <Avatar name={l.name} size="sm" />
                        <div>
                          <div className="font-semibold text-slate-800">{l.name}</div>
                          <div className="text-xs text-slate-400">{l.email || l.phone}</div>
                        </div>
                      </div>
                    </td>
                    <td className="px-4 py-3 text-xs text-slate-500 whitespace-nowrap">{l.source}</td>
                    <td className="px-4 py-3 text-xs text-slate-500 max-w-xs truncate">{l.campaign || '—'}</td>
                    <td className="px-4 py-3"><StagePill stageId={l.stage} sm /></td>
                    <td className="px-4 py-3 text-xs font-semibold text-slate-600 whitespace-nowrap">
                      {l.value ? `${Number(l.value).toLocaleString('es-ES')} €` : '—'}
                    </td>
                    <td className="px-4 py-3 whitespace-nowrap">
                      <span className={`text-xs font-medium ${over ? 'text-red-600' : tod ? 'text-amber-600' : 'text-slate-500'}`}>
                        {over && '⚠ '}{tod && '📅 '}{fmtDate(l.followUpDate)}
                      </span>
                    </td>
                    <td className="px-4 py-3" onClick={e => e.stopPropagation()}>
                      <ContactBtns lead={l} template={waTemplate} waApp={waApp} />
                    </td>
                    <td className="px-4 py-3 text-center" onClick={e => e.stopPropagation()}>
                      <button onClick={() => onDelete(l.id)}
                        className="text-slate-300 hover:text-red-500 transition-colors text-base leading-none w-6 h-6 flex items-center justify-center rounded hover:bg-red-50">✕</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {filtered.length > visibleCount && (
        <div className="flex flex-col items-center gap-2 mt-4">
          <button onClick={() => setVisibleCount(v => v + 50)}
            className="bg-white border border-indigo-200 text-indigo-600 hover:bg-indigo-50 px-5 py-2.5 rounded-xl text-sm font-semibold transition-colors shadow-sm">
            Ver más (+50)
          </button>
          <span className="text-xs text-slate-400">
            Mostrando {Math.min(visibleCount, filtered.length)} de {filtered.length}
          </span>
        </div>
      )}
    </div>
  );
}

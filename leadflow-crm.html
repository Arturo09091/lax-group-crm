const STAGE_PALETTE = ['#3b82f6','#0ea5e9','#14b8a6','#22c55e','#84cc16','#eab308',
                       '#f97316','#ef4444','#ec4899','#a855f7','#6366f1','#64748b'];

function StagesManagerModal({ leads, showToast, onClose }) {
  const { stages, save } = useStages();
  const [draft,   setDraft]   = useState(() => stages.map(s => ({ ...s })));
  const [saving,  setSaving]  = useState(false);
  const [error,   setError]   = useState('');
  const [blocked, setBlocked] = useState({});   // stageId → nº de leads que lo impiden

  // Cuántos leads hay en cada columna (para no dejar borrar las que tienen)
  const counts = useMemo(() => {
    const c = {};
    leads.forEach(l => { c[l.stage] = (c[l.stage] || 0) + 1; });
    return c;
  }, [leads]);

  const isProtected = id => PROTECTED_STAGE_IDS.includes(id);
  const setRow = (i, patch) => setDraft(d => d.map((s, j) => j === i ? { ...s, ...patch } : s));
  const move = (i, dir) => setDraft(d => {
    const j = i + dir;
    if (j < 0 || j >= d.length) return d;
    const n = [...d]; [n[i], n[j]] = [n[j], n[i]]; return n;
  });
  const addStage = () => setDraft(d => [...d, {
    // Id siempre nuevo y aleatorio: si se reutilizara el de una columna borrada,
    // una regla vieja de Meta podría revivir y disparar conversiones falsas.
    id: 'st_' + Math.random().toString(36).slice(2, 9),
    label: '', color: STAGE_PALETTE[d.length % STAGE_PALETTE.length],
    isWon: false, isLost: false, isEntry: false,
  }]);
  const removeRow = i => setDraft(d => d.filter((_, j) => j !== i));

  const invalid = draft.some(s => !String(s.label || '').trim() || String(s.label).trim().length > 40);

  const handleSave = async () => {
    setError(''); setBlocked({}); setSaving(true);
    const res = await save(draft.map((s, i) => ({ id: s.id, label: String(s.label).trim(), color: s.color, position: i })));
    setSaving(false);
    if (res && res.ok) { showToast(res.msg || 'Columnas actualizadas', 'success'); onClose(); return; }
    // Error: el modal NO se cierra y se marca en rojo lo que lo impide
    setError((res && res.error) || 'No se pudo guardar');
    if (res && Array.isArray(res.blocked)) {
      const b = {}; res.blocked.forEach(x => { b[x.stage] = x.count; }); setBlocked(b);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col" onClick={e => e.stopPropagation()}>
        <div className="px-5 py-4 border-b flex items-center justify-between">
          <div>
            <h3 className="font-bold text-slate-800">Columnas del pipeline</h3>
            <p className="text-xs text-slate-500 mt-0.5">Crea, renombra, reordena y colorea. Hasta {MAX_STAGES}.</p>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-xl w-8 h-8 rounded-lg hover:bg-slate-100">✕</button>
        </div>

        <div className="flex-1 overflow-y-auto p-4 space-y-2">
          {draft.map((s, i) => {
            const n = counts[s.id] || 0;
            const prot = isProtected(s.id);
            return (
              <div key={s.id} className={`flex items-center gap-2 p-2 rounded-xl border ${blocked[s.id] ? 'border-red-300 bg-red-50' : 'border-slate-200'}`}>
                <div className="flex flex-col">
                  <button onClick={() => move(i, -1)} disabled={i === 0}
                    className="text-slate-400 hover:text-indigo-600 disabled:opacity-25 text-xs leading-none px-1">▲</button>
                  <button onClick={() => move(i, 1)} disabled={i === draft.length - 1}
                    className="text-slate-400 hover:text-indigo-600 disabled:opacity-25 text-xs leading-none px-1">▼</button>
                </div>
                <input type="color" value={s.color || '#64748b'} onChange={e => setRow(i, { color: e.target.value })}
                  title="Color de la columna"
                  className="w-8 h-8 rounded cursor-pointer border border-slate-200 flex-shrink-0 p-0.5 bg-white" />
                <input value={s.label} onChange={e => setRow(i, { label: e.target.value })}
                  placeholder="Nombre de la columna" maxLength={40}
                  className={`flex-1 min-w-0 border rounded-lg px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400
                    ${!String(s.label || '').trim() ? 'border-red-300' : 'border-slate-200'}`} />
                <span className="text-xs text-slate-400 w-16 text-right flex-shrink-0">{n} lead{n === 1 ? '' : 's'}</span>
                {prot ? (
                  <span title="Columna del sistema: se puede renombrar y mover, pero no borrar" className="w-7 text-center text-slate-300">🔒</span>
                ) : (
                  <button onClick={() => removeRow(i)} disabled={n > 0}
                    title={n > 0 ? `Mueve primero sus ${n} leads` : 'Eliminar columna'}
                    className="w-7 text-slate-400 hover:text-red-500 disabled:opacity-25 disabled:cursor-not-allowed">✕</button>
                )}
              </div>
            );
          })}

          <button onClick={addStage} disabled={draft.length >= MAX_STAGES}
            className="w-full border-2 border-dashed border-slate-200 hover:border-indigo-300 hover:text-indigo-600 text-slate-400 rounded-xl py-2.5 text-sm font-semibold transition-colors disabled:opacity-40">
            ➕ Añadir columna
          </button>

          {error && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-3 py-2">{error}</div>}
          <p className="text-xs text-slate-400 leading-relaxed">
            🔒 <strong>Nuevo Lead</strong>, <strong>Convertido</strong> y <strong>Perdido</strong> se pueden renombrar y mover,
            pero no borrar: sostienen la entrada de leads desde Meta y las métricas de los informes.
            Las columnas nuevas se pueden asignar a eventos de la API de Conversiones desde el panel de administrador.
          </p>
        </div>

        <div className="px-5 py-4 border-t flex gap-2">
          <button onClick={onClose} className="flex-1 border border-slate-200 text-slate-600 hover:bg-slate-50 font-semibold text-sm py-2.5 rounded-xl">Cancelar</button>
          <button onClick={handleSave} disabled={saving || invalid}
            className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-2.5 rounded-xl disabled:opacity-50">
            {saving ? 'Guardando…' : 'Guardar'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════ PIPELINE ═══════════════════════════ */

function PipelineView({ leads, onEdit, onDelete, onStageChange, showToast, waTemplate, waApp }) {
  const { stages, byId, isClosed, wonIds } = useStages();
  const getSL = (id) => (byId[id] ? byId[id].label : id);
const [dragging,  setDragging]  = useState(null);
  const [dragOver,  setDragOver]  = useState(null);
  const [filter,    setFilter]    = useState('');
  const [movingId,  setMovingId]  = useState(null); // id del lead con picker de stage abierto
  const [selectedId, setSelectedId] = useState(null); // móvil: 1er toque selecciona, 2º toque abre la ficha
  const [showEditStages, setShowEditStages] = useState(false);

  // ── Arrastre táctil (móvil): pulsación mantenida → la tarjeta sigue al dedo ──
  const pressTimer = useRef(null);
  const boardRef   = useRef(null); // contenedor del tablero (para auto-scroll durante el arrastre táctil)
  const touchDrag  = useRef({ active: false, lead: null, over: null });
  const startXY    = useRef({ x: 0, y: 0 });
  const ghostRef   = useRef(null);
  const [touchDragLead, setTouchDragLead] = useState(null); // lead "levantado" (para la sombra)

  const moveGhost = (x, y) => { const g = ghostRef.current; if (g) { g.style.left = x + 'px'; g.style.top = y + 'px'; } };

  // Listener NO-PASIVO: sólo así podemos preventDefault y frenar el scroll mientras se arrastra.
  const onDocTouchMove = useCallback((ev) => {
    if (!touchDrag.current.active) return;
    ev.preventDefault();
    const t = ev.touches[0];
    moveGhost(t.clientX, t.clientY);
    // Auto-scroll del tablero al acercar el dedo a los bordes (para llegar a columnas fuera de pantalla)
    const b = boardRef.current;
    if (b) {
      if (t.clientX > window.innerWidth - 56) b.scrollLeft += 14;
      else if (t.clientX < 56) b.scrollLeft -= 14;
    }
    const el  = document.elementFromPoint(t.clientX, t.clientY);
    const col = el && el.closest('[data-stage-id]');
    const sid = col ? col.getAttribute('data-stage-id') : null;
    if (touchDrag.current.over !== sid) { touchDrag.current.over = sid; setDragOver(sid); } // sólo re-render al cambiar de columna
  }, []);

  const beginTouchDrag = (lead, x, y) => {
    touchDrag.current = { active: true, lead, over: lead.stage };
    startXY.current = { x, y };
    setTouchDragLead(lead);
    if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
    document.addEventListener('touchmove', onDocTouchMove, { passive: false });
  };

  const endTouchDrag = (drop) => {
    document.removeEventListener('touchmove', onDocTouchMove, { passive: false });
    const { lead, over } = touchDrag.current;
    if (drop && lead && over && lead.stage !== over) {
      onStageChange(lead.id, over);
      showToast(`${lead.name} → ${getSL(over)}`, 'success');
    }
    touchDrag.current = { active: false, lead: null, over: null };
    setTouchDragLead(null);
    setDragOver(null);
  };

  // Limpieza si el componente se desmonta a media faena.
  useEffect(() => () => { clearTimeout(pressTimer.current); document.removeEventListener('touchmove', onDocTouchMove, { passive: false }); }, [onDocTouchMove]);

  // Paginación incremental por columna: cuántas tarjetas se muestran por etapa.
  const [colVisible, setColVisible] = useState({});
  const colCount = (id) => colVisible[id] || 50;
  useEffect(() => { setColVisible({}); }, [filter]); // al filtrar, reset a 50/columna

  const filtered = useMemo(() => filter
    ? leads.filter(l => l.name.toLowerCase().includes(filter.toLowerCase()) ||
                        (l.campaign || '').toLowerCase().includes(filter.toLowerCase()))
    : leads, [leads, filter]);

  const byStage = useMemo(() => Object.fromEntries(stages.map(s => [s.id, filtered.filter(l => l.stage === s.id)])), [filtered, stages]);
  // Leads cuya etapa ya no existe: se muestran en una columna aparte para
  // poder recolocarlos, en vez de desaparecer del tablero.
  const orphans = useMemo(() => filtered.filter(l => !byId[l.stage]), [filtered, byId]);
  const columns = useMemo(
    () => orphans.length ? [...stages, { id: '__orphan__', label: '⚠ Sin etapa', color: '#94a3b8', orphan: true }] : stages,
    [stages, orphans.length]
  );

  return (
    <>
    <div className="p-4 sm:p-6 anim-fade">
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <div>
          <h1 className="text-2xl font-bold text-slate-800">Pipeline de Ventas</h1>
          <p className="text-sm text-slate-500 mt-0.5">Arrastrá las tarjetas o tocá ⇄ para cambiar de etapa</p>
        </div>
        <div className="flex gap-2 flex-wrap">
          <input value={filter} onChange={e => setFilter(e.target.value)} placeholder="Filtrar leads..."
            className="border border-slate-200 bg-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          <button onClick={() => onEdit(null)}
            className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition-colors shadow-sm flex items-center gap-1.5">
            <Icon name="plus" size={16} /> Nuevo lead
          </button>
          <button onClick={() => setShowEditStages(true)}
            className="border border-slate-300 bg-white text-slate-600 hover:bg-slate-50 px-3 py-2 rounded-xl text-sm font-medium transition-colors">
            ⚙️ Columnas
          </button>
        </div>
      </div>

      <div ref={boardRef} className="flex gap-3 overflow-x-auto pb-4 min-h-[40vh] sm:min-h-[72vh]">
        {columns.map(stage => {
          const stageLeads = stage.orphan ? orphans : (byStage[stage.id] || []);
          const isTarget   = dragOver === stage.id;
          return (
            <div key={stage.id}
              data-stage-id={stage.id}
              onDragOver={e => { e.preventDefault(); setDragOver(stage.id); }}
              onDrop={e => {
                e.preventDefault();
                if (dragging && dragging.stage !== stage.id) {
                  onStageChange(dragging.id, stage.id);
                              showToast(`${dragging.name} → ${getSL(stage.id)}`, 'success');
                }
                setDragging(null); setDragOver(null);
              }}
              onDragLeave={() => setDragOver(null)}
              className={`flex-shrink-0 w-62 flex flex-col rounded-xl transition-all duration-150
                ${isTarget ? 'drop-target' : 'bg-slate-100'}`}
              style={{ width: '240px' }}>

              {/* Column header */}
              <div className="p-3 flex items-center justify-between">
                <div style={pillStyle(stage.color)}
                  className="text-xs font-bold uppercase tracking-wider px-2 py-1 rounded-lg border truncate">
                  {stage.orphan ? stage.label : getSL(stage.id)}
                </div>
                <span className="bg-white border text-xs font-bold px-2 py-0.5 rounded-full text-slate-600">
                  {stageLeads.length}
                </span>
              </div>

              {/* Cards */}
              <div className="flex-1 px-2 pb-2 space-y-2 overflow-y-auto" style={{ maxHeight: 'calc(100vh - 200px)' }}>
                {stageLeads.slice(0, colCount(stage.id)).map(lead => {
                  const over = isOverdue(lead.followUpDate) && !isClosed(lead.stage);
                  const tod  = isToday(lead.followUpDate)   && !isClosed(lead.stage);
                  const showPicker = movingId === lead.id;
                  return (
                    <div key={lead.id}
                      draggable
                      onDragStart={e => { e.dataTransfer.effectAllowed = 'move'; setDragging(lead); }}
                      onDragEnd={() => { setDragging(null); setDragOver(null); }}
                      onTouchStart={e => {
                        if (e.target.closest('a, button')) return;      // taps en contacto/acciones NO inician arrastre
                        const t = e.touches[0];
                        startXY.current = { x: t.clientX, y: t.clientY };
                        clearTimeout(pressTimer.current);
                        pressTimer.current = setTimeout(() => beginTouchDrag(lead, t.clientX, t.clientY), 260); // pulsación mantenida
                      }}
                      onTouchMove={e => {
                        if (touchDrag.current.active) return;            // el arrastre lo gestiona el listener no-pasivo
                        const t = e.touches[0];
                        const moved = Math.abs(t.clientX - startXY.current.x) + Math.abs(t.clientY - startXY.current.y);
                        if (moved > 12) clearTimeout(pressTimer.current); // se está haciendo scroll, cancelamos el long-press
                      }}
                      onTouchEnd={e => {
                        clearTimeout(pressTimer.current);
                        if (touchDrag.current.active) { e.preventDefault(); endTouchDrag(true); return; }
                        if (e.target.closest('a, button')) return;
                        // Si el dedo se movió, era un deslizamiento (scroll) → no seleccionar ni abrir.
                        const t = e.changedTouches && e.changedTouches[0];
                        const moved = t ? Math.abs(t.clientX - startXY.current.x) + Math.abs(t.clientY - startXY.current.y) : 0;
                        if (moved > 10) return;
                        // Toque deliberado: 1º selecciona (borde), 2º sobre el mismo lead abre la ficha.
                        if (selectedId === lead.id) { setSelectedId(null); onEdit(lead); }
                        else setSelectedId(lead.id);
                      }}
                      onTouchCancel={() => { clearTimeout(pressTimer.current); if (touchDrag.current.active) endTouchDrag(false); }}
                      onClick={e => { if (!('ontouchstart' in window) && !e.target.closest('a, button')) onEdit(lead); }}
                      className={`bg-white rounded-xl border p-3 cursor-grab active:cursor-grabbing
                        hover:shadow-md transition-all duration-150 select-none
                        ${(dragging?.id === lead.id || touchDragLead?.id === lead.id) ? 'drag-active shadow-lg opacity-40' : 'shadow-sm'}
                        ${selectedId === lead.id ? 'ring-2 ring-indigo-500 border-indigo-400' : ''}
                        ${over ? 'border-red-200 bg-red-50' : tod ? 'border-amber-200 bg-amber-50' : 'border-slate-200'}`}>

                      <div className="flex items-center gap-2 mb-2">
                        <Avatar name={lead.name} size="sm" />
                        <div className="min-w-0">
                          <div className="text-sm font-semibold text-slate-800 truncate">{lead.name}</div>
                          <div className="text-xs text-slate-400 truncate">{lead.source}</div>
                        </div>
                      </div>

                      {lead.campaign && (
                        <div className="text-xs text-slate-500 truncate mb-1.5">📣 {lead.campaign}</div>
                      )}

                      {lead.followUpDate && !isClosed(lead.stage) && (
                        <div className={`text-xs mb-1.5 font-medium ${over ? 'text-red-600' : tod ? 'text-amber-600' : 'text-slate-400'}`}>
                          {over ? `⚠ Vencido ${fmtDate(lead.followUpDate)}` : tod ? '📅 Contactar hoy' : `🗓 ${fmtDate(lead.followUpDate)}`}
                        </div>
                      )}

                      {lead.value > 0 && (
                        <div className="text-xs text-emerald-700 font-semibold mb-2">
                          💰 {Number(lead.value).toLocaleString('es-ES')} €
                        </div>
                      )}

                      <div className="flex items-center justify-between mt-1 flex-wrap gap-y-1.5">
                        <ContactBtns lead={lead} template={waTemplate} waApp={waApp} />
                        <div className="flex items-center gap-1">
                          {/* Mover stage button — visible on touch devices */}
                          <button
                            onClick={e => { e.stopPropagation(); setMovingId(showPicker ? null : lead.id); }}
                            title="Mover a etapa"
                            className="text-sm text-indigo-500 hover:bg-indigo-50 h-9 min-w-9 px-2 flex items-center justify-center rounded-lg transition-colors border border-indigo-200 font-bold">
                            ⇄
                          </button>
                          {!isClosed(stage.id) && wonIds[0] && (
                            <button
                              onClick={e => { e.stopPropagation(); onStageChange(lead.id, wonIds[0]); showToast(`🎉 ${lead.name} convertido!`, 'success'); }}
                              title="Marcar convertido"
                              className="text-sm text-emerald-600 hover:bg-emerald-50 h-9 min-w-9 px-2 flex items-center justify-center rounded-lg transition-colors font-semibold border border-emerald-200">
                              ✓
                            </button>
                          )}
                          <button
                            onClick={e => { e.stopPropagation(); onDelete(lead.id); }}
                            title="Eliminar lead"
                            className="text-slate-400 hover:text-red-500 hover:bg-red-50 h-9 min-w-9 flex items-center justify-center rounded-lg transition-colors text-base leading-none border border-transparent hover:border-red-200">
                            🗑
                          </button>
                        </div>
                      </div>

                      {/* Móvil: pista tras el primer toque (seleccionado) */}
                      {selectedId === lead.id && (
                        <div className="mt-1.5 text-[10px] font-semibold text-indigo-600 text-center">
                          Toca de nuevo para abrir la ficha
                        </div>
                      )}

                      {/* Stage picker — se abre al tocar ⇄ */}
                      {showPicker && (
                        <div className="mt-2 pt-2 border-t border-slate-100">
                          <p className="text-xs text-slate-400 mb-1.5 font-medium">Mover a:</p>
                          {/* max-h + scroll: con muchas columnas la lista no puede crecer sin fin */}
                          <div className="flex flex-wrap gap-1 max-h-40 overflow-y-auto">
                            {stages.filter(s => s.id !== lead.stage).map(s => (
                              <button key={s.id}
                                onClick={e => { e.stopPropagation(); onStageChange(lead.id, s.id); showToast(`${lead.name} → ${s.label}`, 'success'); setMovingId(null); }}
                                style={pillStyle(s.color)}
                                className="text-xs px-2.5 py-1.5 rounded-lg border font-semibold transition-colors">
                                {s.label}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}

                {stageLeads.length === 0 && (
                  <div className={`text-center py-10 px-3 text-xs text-slate-400 rounded-xl border-2 border-dashed transition-all
                    ${isTarget ? 'border-indigo-400 text-indigo-500' : 'border-slate-200'}`}>
                    {isTarget ? '¡Soltá aquí!' : 'Sin leads en esta etapa'}
                  </div>
                )}
                {stageLeads.length > colCount(stage.id) && (
                  <button onClick={() => setColVisible(v => ({ ...v, [stage.id]: colCount(stage.id) + 50 }))}
                    className="w-full text-xs font-semibold text-indigo-600 bg-white border border-indigo-200 hover:bg-indigo-50 rounded-xl py-2 transition-colors">
                    Ver más (+50) · {Math.min(colCount(stage.id), stageLeads.length)}/{stageLeads.length}
                  </button>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {/* Sombra que sigue al dedo durante el arrastre táctil (móvil) */}
      {touchDragLead && (
        <div ref={ghostRef}
          style={{ position: 'fixed', left: startXY.current.x + 'px', top: startXY.current.y + 'px', transform: 'translate(-50%,-50%)', pointerEvents: 'none', zIndex: 9999, width: '220px', opacity: 0.96 }}
          className="bg-white rounded-xl border-2 border-indigo-500 shadow-2xl p-3">
          <div className="flex items-center gap-2">
            <Avatar name={touchDragLead.name} size="sm" />
            <div className="min-w-0">
              <div className="text-sm font-semibold text-slate-800 truncate">{touchDragLead.name}</div>
              <div className="text-xs text-indigo-500 font-medium">Suelta sobre una columna…</div>
            </div>
          </div>
        </div>
      )}
    </div>
      {/* ── Gestor de columnas del pipeline ── */}
      {showEditStages && (
        <StagesManagerModal leads={leads} showToast={showToast} onClose={() => setShowEditStages(false)} />
      )}
  </>
  );
}

/* ═══════════════════════════ REMINDERS ══════════════════════════ */

function RemindersView({ leads, onEdit, waTemplate, waApp }) {
  const { isClosed } = useStages();
  const overdue  = leads.filter(l => isOverdue(l.followUpDate) && !isClosed(l.stage))
                        .sort((a, b) => a.followUpDate.localeCompare(b.followUpDate));
  const todayArr = leads.filter(l => isToday(l.followUpDate)   && !isClosed(l.stage));
  const upcoming = leads.filter(l => { const d = daysUntil(l.followUpDate); return d !== null && d > 0 && d <= 7 && !isClosed(l.stage); })
                        .sort((a, b) => a.followUpDate.localeCompare(b.followUpDate));
  const later    = leads.filter(l => { const d = daysUntil(l.followUpDate); return d !== null && d > 7 && !isClosed(l.stage); })
                        .sort((a, b) => a.followUpDate.localeCompare(b.followUpDate));
  const noDate   = leads.filter(l => !l.followUpDate && !isClosed(l.stage));

  const Card = ({ lead, urgency }) => {
    const d = daysUntil(lead.followUpDate);
    const meta = {
      overdue:  { bg:'bg-red-50 border-red-200',    text:'text-red-600',    label: d !== null ? `⚠ Vencido hace ${Math.abs(d)} día${Math.abs(d)!==1?'s':''}` : '⚠ Vencido' },
      today:    { bg:'bg-amber-50 border-amber-200', text:'text-amber-700',  label: '📅 Contactar hoy' },
      upcoming: { bg:'bg-blue-50 border-blue-200',   text:'text-blue-600',   label: `🗓 En ${d} día${d!==1?'s':''}` },
      later:    { bg:'bg-slate-50 border-slate-200', text:'text-slate-500',  label: `🗓 ${fmtDate(lead.followUpDate)}` },
      nodate:   { bg:'bg-slate-50 border-slate-200', text:'text-slate-400',  label: 'Sin fecha asignada' },
    }[urgency] || {};

    return (
      <div onClick={(e) => { if (e.target.closest('a, button')) return; onEdit(lead); }}
        className={`flex items-center gap-4 p-4 rounded-xl border ${meta.bg} cursor-pointer hover:shadow-md transition-all`}>
        <div className="w-10 h-10 rounded-full bg-white border-2 border-indigo-200 text-indigo-700 flex items-center justify-center text-sm font-bold flex-shrink-0">
          {lead.name.charAt(0)}
        </div>
        <div className="flex-1 min-w-0">
          <div className="font-semibold text-slate-800">{lead.name}</div>
          <div className={`text-xs font-medium mt-0.5 ${meta.text}`}>{meta.label}</div>
          {lead.campaign && <div className="text-xs text-slate-400 mt-0.5 truncate">📣 {lead.campaign}</div>}
          {lead.notes && <div className="text-xs text-slate-400 mt-0.5 truncate italic">"{lead.notes}"</div>}
        </div>
        <div className="flex flex-col items-end gap-2 flex-shrink-0">
          <StagePill stageId={lead.stage} sm />
          <ContactBtns lead={lead} template={waTemplate} waApp={waApp} />
        </div>
      </div>
    );
  };

  const Section = ({ title, items, urgency, empty }) => (
    <div>
      <h3 className="font-semibold text-slate-700 mb-3 flex items-center gap-2">
        {title}
        <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${items.length > 0 && urgency === 'overdue' ? 'bg-red-700 text-white' : 'bg-slate-200 text-slate-600'}`}>
          {items.length}
        </span>
      </h3>
      {items.length === 0
        ? <p className="text-sm text-slate-400 bg-white border rounded-xl p-4">{empty}</p>
        : <div className="space-y-2">{items.map(l => <Card key={l.id} lead={l} urgency={urgency} />)}</div>
      }
    </div>
  );

  return (
    <div className="p-4 sm:p-6 anim-fade max-w-3xl">
      <div className="mb-6">
        <h1 className="text-2xl font-bold text-slate-800">Recordatorios y Seguimientos</h1>
        <p className="text-sm text-slate-500 mt-0.5">No pierdas ninguna oportunidad — contactá a tus leads a tiempo</p>
      </div>

      {overdue.length > 0 && (
        <div className="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 flex items-start gap-3">
          <span className="text-2xl mt-0.5">🚨</span>
          <div>
            <div className="font-bold text-red-700">¡Acción requerida ahora!</div>
            <div className="text-sm text-red-600 mt-0.5">
              Tenés <strong>{overdue.length} lead{overdue.length !== 1 ? 's' : ''}</strong> con seguimiento vencido.
              Cada hora que pasa es menor probabilidad de conversión.
            </div>
          </div>
        </div>
      )}

      <div className="space-y-8">
        <Section title="🚨 Vencidos"         items={overdue}  urgency="overdue"  empty="✓ Sin seguimientos vencidos" />
        <Section title="📅 Para hoy"          items={todayArr} urgency="today"    empty="Sin seguimientos programados para hoy" />
        <Section title="📆 Próximos 7 días"   items={upcoming} urgency="upcoming" empty="Sin seguimientos esta semana" />
        <Section title="🗓 Más adelante"       items={later}    urgency="later"    empty="Sin seguimientos programados" />
        <Section title="📋 Sin fecha asignada" items={noDate}   urgency="nodate"   empty="Todos los leads activos tienen fecha de seguimiento" />
      </div>
    </div>
  );
}

/* ═══════════════════════════ REPORTS ═══════════════════════════ */

/* ── Rangos de fecha (estilo Meta Ads) ─────────────────────────────
   Convención de Meta: "últimos N días" NO incluye hoy. Todo se calcula en
   hora LOCAL y se compara como texto YYYY-MM-DD, así no hay desfases. */
const DATE_PRESETS = [
  { id: 'today',           label: 'Hoy' },
  { id: 'yesterday',       label: 'Ayer' },
  { id: 'today_yesterday', label: 'Hoy y ayer' },
  { id: 'last_7d',         label: 'Últimos 7 días' },
  { id: 'last_14d',        label: 'Últimos 14 días' },
  { id: 'last_28d',        label: 'Últimos 28 días' },
  { id: 'last_30d',        label: 'Últimos 30 días' },
  { id: 'this_week',       label: 'Esta semana' },
  { id: 'last_week',       label: 'Última semana' },
  { id: 'this_month',      label: 'Este mes' },
  { id: 'last_month',      label: 'El mes pasado' },
  { id: 'maximum',         label: 'Máximo' },
];

function presetRange(preset, leads) {
  const T = todayISO();
  const lastN = n => ({ from: addDays(T, -n), to: addDays(T, -1) });
  switch (preset) {
    case 'today':           return { preset, from: T, to: T };
    case 'yesterday':       return { preset, from: addDays(T, -1), to: addDays(T, -1) };
    case 'today_yesterday': return { preset, from: addDays(T, -1), to: T };
    case 'last_7d':         return { preset, ...lastN(7) };
    case 'last_14d':        return { preset, ...lastN(14) };
    case 'last_28d':        return { preset, ...lastN(28) };
    case 'last_30d':        return { preset, ...lastN(30) };
    case 'this_week':       return { preset, from: mondayOf(T), to: T };
    case 'last_week':       return { preset, from: addDays(mondayOf(T), -7), to: addDays(mondayOf(T), -1) };
    case 'this_month':      return { preset, from: startOfMonth(T), to: T };
    case 'last_month': {
      const prevMonthDay = addDays(startOfMonth(T), -1);
      return { preset, from: startOfMonth(prevMonthDay), to: prevMonthDay };
    }
    case 'maximum': {
      const dates = (leads || []).map(l => String(l.createdAt || '').slice(0, 10)).filter(Boolean).sort();
      return { preset, from: dates[0] || T, to: T };
    }
    default:                return { preset: 'last_30d', ...lastN(30) };
  }
}

// Periodo anterior de la MISMA longitud (mes natural en los presets de mes).
function withComparison(range) {
  const { from, to, preset } = range;
  const label = preset === 'custom'
    ? `${fmtDate(from)} – ${fmtDate(to)}`
    : ((DATE_PRESETS.find(p => p.id === preset) || {}).label || `${fmtDate(from)} – ${fmtDate(to)}`);
  if (preset === 'maximum') return { ...range, label, comparable: false, prevFrom: null, prevTo: null };
  let prevTo   = addDays(from, -1);
  let prevFrom = addDays(prevTo, -(dayCount(from, to) - 1));
  if (preset === 'this_month' || preset === 'last_month') {
    prevFrom = startOfMonth(addDays(from, -1));
    prevTo   = endOfMonth(prevFrom);
  }
  return { ...range, label, comparable: true, prevFrom, prevTo };
}

function buildReport(leads, range, ctx) {
  const { from, to, prevFrom, prevTo, comparable, label } = range;
  const day = l => String(l.createdAt || '').slice(0, 10);
  const inR = (l, a, b) => { const d = day(l); return !!d && d >= a && d <= b; };

  const period     = leads.filter(l => inR(l, from, to));
  const prevPeriod = comparable ? leads.filter(l => inR(l, prevFrom, prevTo)) : [];
  const noDate     = leads.filter(l => !day(l)).length;

  const isWon = id => ctx.isWon(id), isLost = id => ctx.isLost(id), isClosed = id => ctx.isClosed(id);

  const total     = period.length;
  const prevTotal = prevPeriod.length;
  const converted = period.filter(l => isWon(l.stage)).length;
  const lost      = period.filter(l => isLost(l.stage)).length;
  const active    = period.filter(l => !isClosed(l.stage)).length;
  const convRate  = total ? Math.round(converted / total * 100) : 0;
  const lostRate  = total ? Math.round(lost / total * 100) : 0;
  const potValue  = period.filter(l => !isLost(l.stage)).reduce((s,l) => s+(+l.value||0), 0);
  const wonValue  = period.filter(l => isWon(l.stage)).reduce((s,l) => s+(+l.value||0), 0);
  const trend     = (comparable && prevTotal > 0) ? Math.round((total - prevTotal) / prevTotal * 100) : null;
  const overdue   = period.filter(l => isOverdue(l.followUpDate) && !isClosed(l.stage)).length;
  const avgValue  = converted > 0 ? Math.round(wonValue / converted) : 0;

  const byStage = ctx.stages.map(s => ({
    ...s, count: period.filter(l => l.stage === s.id).length,
    pct: total ? Math.round(period.filter(l => l.stage === s.id).length / total * 100) : 0,
  }));
  const orphanCount = period.filter(l => !ctx.byId[l.stage]).length;
  if (orphanCount > 0) byStage.push({
    id: '__orphan__', label: '⚠ Sin etapa', color: '#94a3b8',
    count: orphanCount, pct: total ? Math.round(orphanCount / total * 100) : 0,
  });

  const srcMap = {};
  period.forEach(l => { if (l.source) srcMap[l.source] = (srcMap[l.source]||0)+1; });
  const bySrc = Object.entries(srcMap).sort((a,b) => b[1]-a[1]);

  let rating, ratingEmoji, ratingBg;
  if      (convRate >= 20) { rating = 'Excelente';          ratingEmoji = '🏆'; ratingBg = 'bg-emerald-50 border-emerald-200 text-emerald-800'; }
  else if (convRate >= 12) { rating = 'Muy bueno';           ratingEmoji = '✅'; ratingBg = 'bg-blue-50 border-blue-200 text-blue-800'; }
  else if (convRate >= 6)  { rating = 'Regular';             ratingEmoji = '📊'; ratingBg = 'bg-yellow-50 border-yellow-200 text-yellow-800'; }
  else if (total === 0)    { rating = 'Sin actividad';        ratingEmoji = '😴'; ratingBg = 'bg-slate-50 border-slate-200 text-slate-600'; }
  else                     { rating = 'Necesita atención';   ratingEmoji = '⚠️'; ratingBg = 'bg-red-50 border-red-200 text-red-800'; }

  const bottleneck = byStage.filter(s => !isClosed(s.id)).reduce((m,s) => s.count > m.count ? s : m, { count:0, label:'—' });
  const bestSrc    = bySrc[0];
  const periodTxt  = `${String(label).toLowerCase()} (${fmtDate(from)} – ${fmtDate(to)})`;

  let summary;
  if (total === 0) {
    summary = `No se registraron leads en ${periodTxt}. Revisá las campañas de captación activas y asegurate de que el webhook de Make está funcionando correctamente.`;
  } else {
    const trendTxt = (!comparable || trend === null) ? '' : trend > 0 ? `, un ${trend}% más que el período anterior 📈` : trend < 0 ? `, un ${Math.abs(trend)}% menos que el período anterior 📉` : ', igual que el período anterior';
    summary = `En ${periodTxt} captaste ${total} lead${total!==1?'s':''}${trendTxt}. De ellos, ${converted} se convirtier${converted!==1?'on':'ó'} en clientes (${convRate}%)${wonValue > 0 ? ` generando ${wonValue.toLocaleString('es-ES')} € en ventas cerradas` : ''}. Hay ${active} lead${active!==1?'s':''} activos con un valor potencial de ${potValue.toLocaleString('es-ES')} €.`;
  }

  const positives = [];
  if (convRate >= 15) positives.push(`Tasa de conversión del ${convRate}% — por encima del promedio del sector (10-15%).`);
  if (trend !== null && trend > 10) positives.push(`Crecimiento del ${trend}% en volumen de leads vs. período anterior.`);
  if (wonValue > 0) positives.push(`${wonValue.toLocaleString('es-ES')} € en ventas cerradas durante este período.`);
  if (bestSrc) positives.push(`"${bestSrc[0]}" es tu mejor fuente con ${bestSrc[1]} lead${bestSrc[1]!==1?'s':''}.`);
  if (overdue === 0 && total > 0) positives.push('Todos los seguimientos están al día — excelente gestión.');
  if (positives.length === 0) positives.push('El sistema está activo y registrando leads correctamente.');

  const issues = [];
  if (overdue > 0) issues.push(`${overdue} lead${overdue!==1?'s tienen':' tiene'} seguimiento vencido — cada día reduce las chances de cerrar.`);
  if (lostRate > 30) issues.push(`Alta tasa de pérdida (${lostRate}%): ${lost} leads descartados. Revisar el proceso de calificación.`);
  if (bottleneck.count > 2) issues.push(`Embudo congestionado en "${bottleneck.label}" con ${bottleneck.count} leads sin avanzar.`);
  if (convRate < 5 && total > 3) issues.push(`Conversión del ${convRate}% es baja. Evaluar calidad de leads entrantes y proceso de venta.`);
  if (trend !== null && trend < -20) issues.push(`Caída del ${Math.abs(trend)}% en leads — revisá el rendimiento de tus campañas.`);
  if (issues.length === 0 && total > 0) issues.push('No se detectaron problemas críticos en este período.');
  if (issues.length === 0 && total === 0) issues.push('Sin leads no hay datos para analizar. Verificá que Make esté enviando los leads al CRM.');

  const recs = [];
  if (overdue > 0) recs.push(`Prioridad #1: contactar hoy los ${overdue} lead${overdue!==1?'s':''} con seguimiento vencido.`);
  if (bottleneck.count > 1) recs.push(`Agendar llamadas para los ${bottleneck.count} leads estancados en "${bottleneck.label}".`);
  if (active > 0) recs.push(`Hay ${potValue.toLocaleString('es-ES')} € en el pipeline activo. Enfocate en cerrarlos antes de captar nuevos.`);
  if (bySrc.length > 1) recs.push(`Invertí más en "${bestSrc[0]}" y analizá el ROI de las demás fuentes.`);
  if (convRate < 10 && total > 0) recs.push('Revisá el script de ventas y el tiempo de respuesta al primer contacto.');
  if (recs.length === 0) recs.push('Mantené el ritmo actual y registrá cada interacción en el CRM.');

  return { total, prevTotal, trend, comparable, noDate, rangeLabel: label, from, to,
           converted, lost, active, convRate, lostRate, potValue, wonValue, avgValue, overdue,
           byStage, bySrc, rating, ratingEmoji, ratingBg, summary,
           positives: positives.slice(0,3), issues: issues.slice(0,3), recs: recs.slice(0,3) };
}

/* ── Calendario de dos meses + presets ───────────────────────────── */
function MonthGrid({ monthISO, from, to, hover, onPick, onHover }) {
  const [y, m] = monthISO.split('-').map(Number);
  const first  = new Date(y, m - 1, 1);
  const days   = new Date(y, m, 0).getDate();
  const lead   = (first.getDay() + 6) % 7;   // semana empezando en lunes
  const T      = todayISO();
  const end    = to || hover;
  const cells  = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(isoLocal(new Date(y, m - 1, d)));
  const title = first.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
  return (
    <div className="flex-1 min-w-0">
      <div className="text-center text-sm font-semibold text-slate-700 mb-2 capitalize">{title}</div>
      <div className="grid grid-cols-7 gap-0.5 text-center">
        {['lun','mar','mié','jue','vie','sáb','dom'].map(d => (
          <div key={d} className="text-[10px] text-slate-400 font-medium py-1">{d}</div>
        ))}
        {cells.map((iso, i) => {
          if (!iso) return <div key={'e' + i} />;
          const future  = iso > T;
          const lo      = from && end ? (from < end ? from : end) : null;
          const hi      = from && end ? (from < end ? end : from) : null;
          const isEdge  = iso === from || (to && iso === to);
          const inRange = lo && hi && iso >= lo && iso <= hi;
          return (
            <button key={iso} disabled={future}
              onClick={() => onPick(iso)} onMouseEnter={() => onHover(iso)}
              className={`text-xs py-1.5 rounded transition-colors disabled:opacity-25 disabled:cursor-not-allowed
                ${isEdge ? 'bg-indigo-600 text-white font-bold'
                  : inRange ? 'bg-indigo-100 text-indigo-800'
                  : 'hover:bg-slate-100 text-slate-700'}`}>
              {Number(iso.slice(8))}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function DateRangePicker({ range, leads, onApply }) {
  const [open,  setOpen]  = useState(false);
  const [draft, setDraft] = useState(range);
  const [hover, setHover] = useState(null);
  const [pick,  setPick]  = useState(null);   // primer clic de un rango personalizado
  // Se abre en el mes de INICIO del rango: así se ven los dos extremos a la vez.
  const [month, setMonth] = useState(() => startOfMonth(range.from || todayISO()));
  const ref = useRef(null);

  useEffect(() => {
    if (open) { setDraft(range); setPick(null); setHover(null); setMonth(startOfMonth(range.from || todayISO())); }
  }, [open]);
  useEffect(() => {
    if (!open) return;
    const onDoc = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onEsc = e => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onEsc);
    return () => { document.removeEventListener('mousedown', onDoc); document.removeEventListener('keydown', onEsc); };
  }, [open]);

  const prevMonth = m => { const [y, mm] = m.split('-').map(Number); return isoLocal(new Date(y, mm - 2, 1)); };
  const nextMonth = m => { const [y, mm] = m.split('-').map(Number); return isoLocal(new Date(y, mm, 1)); };

  const pickDay = iso => {
    if (!pick) { setPick(iso); setDraft({ preset: 'custom', from: iso, to: '' }); }
    else {
      const a = pick <= iso ? pick : iso, b = pick <= iso ? iso : pick;
      setDraft({ preset: 'custom', from: a, to: b });
      setPick(null);
    }
  };

  return (
    <div className="relative" ref={ref}>
      <button onClick={() => setOpen(o => !o)}
        className="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-white text-slate-700 border border-slate-200 hover:border-indigo-300 transition-all">
        📅 {range.label}
        <span className="text-slate-400 text-xs">▾</span>
      </button>

      {open && (
        <div className="no-print absolute right-0 top-full mt-2 z-30 bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col sm:flex-row overflow-hidden"
             style={{ width: 'min(680px, calc(100vw - 32px))' }}>
          <div className="sm:w-44 border-b sm:border-b-0 sm:border-r border-slate-100 p-2 max-h-44 sm:max-h-none overflow-y-auto flex-shrink-0">
            {DATE_PRESETS.map(p => (
              <button key={p.id} onClick={() => setDraft(presetRange(p.id, leads))}
                className={`w-full text-left px-3 py-1.5 rounded-lg text-sm transition-colors
                  ${draft.preset === p.id ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                {p.label}
              </button>
            ))}
          </div>

          <div className="flex-1 min-w-0 p-3">
            <div className="flex items-center justify-between mb-1">
              <button onClick={() => setMonth(prevMonth(month))} className="text-slate-400 hover:text-slate-700 px-2 py-1 rounded hover:bg-slate-100">‹</button>
              <button onClick={() => setMonth(nextMonth(month))} className="text-slate-400 hover:text-slate-700 px-2 py-1 rounded hover:bg-slate-100">›</button>
            </div>
            <div className="flex gap-4" onMouseLeave={() => setHover(null)}>
              <MonthGrid monthISO={month} from={draft.from} to={draft.to} hover={hover} onPick={pickDay} onHover={setHover} />
              <div className="hidden sm:flex flex-1 min-w-0">
                <MonthGrid monthISO={nextMonth(month)} from={draft.from} to={draft.to} hover={hover} onPick={pickDay} onHover={setHover} />
              </div>
            </div>
            <div className="flex items-center justify-between gap-2 mt-3 pt-3 border-t border-slate-100">
              <span className="text-xs text-slate-500 truncate">
                {draft.from ? `${fmtDate(draft.from)} – ${draft.to ? fmtDate(draft.to) : '…'}` : 'Elige un rango'}
              </span>
              <div className="flex gap-2 flex-shrink-0">
                <button onClick={() => setOpen(false)}
                  className="px-3 py-1.5 rounded-lg text-sm border border-slate-200 text-slate-600 hover:bg-slate-50">Cancelar</button>
                <button disabled={!draft.from || !draft.to}
                  onClick={() => { onApply(withComparison(draft)); setOpen(false); }}
                  className="px-4 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-40">Actualizar</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

            <div className="flex items-center gap-2 mb-3">

              {report.recs.map((p,i) => (
                <li key={i} className="flex gap-2 text-xs text-indigo-700 leading-relaxed">
                  <span className="flex-shrink-0 font-bold mt-0.5">{i+1}.</span>
                  <span>{p}</span>

              ))}
            </ul>
          </div>
        </div>
      </div>

    </div>
  );

/* ══════════════════ AVISOS POR CORREO (cliente) ═════════════════ */

function AvisosView({ leads, showToast }) {
  const { isClosed } = useStages();
  const [s, setS]         = useState(null);
  const [saving, setSaving] = useState(false);
  const [testing, setTesting] = useState(false);
  const [dirty, setDirty]   = useState(false);

  useEffect(() => {
    fetch('/api/notification-settings').then(r => r.json())
      .then(d => setS({ enabled:false, emails:'', includeOverdue:false, hour:9, weekdaysOnly:true, ...d }))
      .catch(() => showToast('No se pudieron cargar los ajustes', 'error'));
  }, []);

  // Cuántos leads entrarían HOY en el aviso (para que se vea el efecto real)
  const hoy = todayISO();
  const cuentaHoy     = leads.filter(l => l.followUpDate === hoy && !isClosed(l.stage)).length;
  const cuentaVencidos = leads.filter(l => l.followUpDate && l.followUpDate < hoy && !isClosed(l.stage)).length;

  const set = (k, v) => { setS(x => ({ ...x, [k]: v })); setDirty(true); };

  // finally: si el servidor rechaza el guardado, el botón DEBE volver a
  // habilitarse. Con un return dentro del try se quedaba en "Guardando…".
  const guardar = async () => {
    setSaving(true);
    try {
      const r = await fetch('/api/notification-settings', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled: s.enabled, emails: s.emails, includeOverdue: s.includeOverdue, hour: s.hour, weekdaysOnly: s.weekdaysOnly }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { showToast(d.error || 'No se pudo guardar', 'error'); return; }
      // 'configurado' sólo viene en la carga inicial: si se pisara aquí, el
      // botón de prueba se quedaría deshabilitado justo después de guardar.
      setS(x => ({ ...x, ...d, configurado: x.configurado }));
      setDirty(false);
      showToast(d.enabled ? 'Aviso activado' : 'Ajustes guardados', 'success');
    } catch {
      showToast('Error de conexión', 'error');
    } finally {
      setSaving(false);
    }
  };

  const probar = async () => {
    setTesting(true);
    try {
      const r = await fetch('/api/notification-settings/test', { method: 'POST' });
      const d = await r.json().catch(() => ({}));
      showToast(r.ok ? `Correo de prueba enviado a ${(d.enviadoA||[]).join(', ')}` : (d.error || 'No se pudo enviar'), r.ok ? 'success' : 'error');
    } catch {
      showToast('Error de conexión', 'error');
    } finally {
      setTesting(false);
    }
  };

  if (!s) return <div className="p-6 text-slate-400">Cargando…</div>;

  const horas = Array.from({ length: 24 }, (_, i) => i);

  return (
    <div className="p-4 sm:p-6 anim-fade max-w-2xl">
      <div className="mb-6">
        <h1 className="text-2xl font-bold text-slate-800">Avisos por correo</h1>
        <p className="text-sm text-slate-500 mt-0.5">Recibe cada día un correo con las personas a las que tienes que contactar.</p>
      </div>

      {!s.configurado && (
        <div className="bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-xl px-4 py-3 mb-4">
          El envío de correo aún no está disponible en esta cuenta. Habla con tu gestor de LAX.
        </div>
      )}

      {/* Resumen de lo que entraría hoy */}
      <div className="flex gap-3 mb-5 flex-wrap">
        <div className="bg-white border border-slate-200 rounded-xl px-4 py-3">
          <div className="text-xs text-slate-500 font-semibold uppercase tracking-wide">Para hoy</div>
          <div className="text-2xl font-bold text-indigo-600">{cuentaHoy}</div>
        </div>
        <div className="bg-white border border-slate-200 rounded-xl px-4 py-3">
          <div className="text-xs text-slate-500 font-semibold uppercase tracking-wide">Vencidos</div>
          <div className={`text-2xl font-bold ${cuentaVencidos ? 'text-red-600' : 'text-slate-700'}`}>{cuentaVencidos}</div>
        </div>
      </div>

      <div className="bg-white border rounded-2xl p-5 sm:p-6 space-y-5">

        {/* Activar */}
        <label className="flex items-start gap-3 cursor-pointer">
          <input type="checkbox" checked={!!s.enabled} onChange={e => set('enabled', e.target.checked)}
            className="mt-0.5 w-5 h-5 rounded accent-indigo-600 flex-shrink-0" />
          <div>
            <div className="font-semibold text-slate-800">Quiero recibir el aviso diario</div>
            <div className="text-xs text-slate-500">Si no hay nadie a quien contactar, no se envía nada.</div>
          </div>
        </label>

        {/* Correos */}
        <div>
          <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">
            ¿A qué correo lo enviamos?
          </label>
          <input value={s.emails || ''} onChange={e => set('emails', e.target.value)}
            className={inputCls} placeholder="tucorreo@ejemplo.com" />
          <div className="text-xs text-slate-400 mt-1">
            Puedes poner varios separados por comas (hasta 5), por si lo quiere recibir tu equipo.
          </div>
        </div>

        {/* Qué incluir */}
        <div>
          <label className="block text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wide">¿Qué quieres que incluya?</label>
          <div className="space-y-2">
            <label className="flex items-start gap-3 cursor-pointer border border-slate-200 rounded-xl p-3 hover:bg-slate-50 transition-colors">
              <input type="radio" name="inc" checked={!s.includeOverdue} onChange={() => set('includeOverdue', false)}
                className="mt-0.5 w-4 h-4 accent-indigo-600 flex-shrink-0" />
              <div>
                <div className="text-sm font-semibold text-slate-800">Solo los de hoy</div>
                <div className="text-xs text-slate-500">Las personas cuya fecha de contacto es hoy. Correo corto y al grano.</div>
              </div>
            </label>
            <label className="flex items-start gap-3 cursor-pointer border border-slate-200 rounded-xl p-3 hover:bg-slate-50 transition-colors">
              <input type="radio" name="inc" checked={!!s.includeOverdue} onChange={() => set('includeOverdue', true)}
                className="mt-0.5 w-4 h-4 accent-indigo-600 flex-shrink-0" />
              <div>
                <div className="text-sm font-semibold text-slate-800">Los de hoy y también los vencidos</div>
                <div className="text-xs text-slate-500">
                  Añade los que se quedaron sin contactar{cuentaVencidos > 0 ? ` (ahora mismo tienes ${cuentaVencidos})` : ''}. Se muestran los más recientes primero.
                </div>
              </div>
            </label>
          </div>
        </div>

        {/* Hora y días */}
        <div className="grid sm:grid-cols-2 gap-4">
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">¿A qué hora?</label>
            <select value={s.hour} onChange={e => set('hour', parseInt(e.target.value, 10))} className={inputCls}>
              {horas.map(h => <option key={h} value={h}>{String(h).padStart(2,'0')}:00</option>)}
            </select>
            <div className="text-xs text-slate-400 mt-1">Hora peninsular española.</div>
          </div>
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">¿Qué días?</label>
            <select value={s.weekdaysOnly ? 'lv' : 'all'} onChange={e => set('weekdaysOnly', e.target.value === 'lv')} className={inputCls}>
              <option value="lv">Solo de lunes a viernes</option>
              <option value="all">Todos los días</option>
            </select>
            <div className="text-xs text-slate-400 mt-1">Para no recibirlo en fin de semana.</div>
          </div>
        </div>

        <div className="flex gap-2 pt-1 flex-wrap">
          <button onClick={guardar} disabled={saving}
            className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-5 py-2.5 rounded-xl transition-colors disabled:opacity-50">
            {saving ? 'Guardando…' : 'Guardar'}
          </button>
          <button onClick={probar} disabled={testing || dirty || !s.emails || !s.configurado}
            title={dirty ? 'Guarda primero los cambios' : 'Te enviamos el aviso ahora mismo'}
            className="border border-slate-200 text-slate-600 hover:bg-slate-50 font-semibold text-sm px-5 py-2.5 rounded-xl transition-colors disabled:opacity-40">
            {testing ? 'Enviando…' : 'Enviarme una prueba'}
          </button>
        </div>
      </div>

      <p className="text-xs text-slate-400 mt-4 leading-relaxed">
        En el correo verás cada persona con botones para escribirle por WhatsApp o llamarla directamente,
        con el mensaje que ya tienes configurado. Los leads marcados como convertidos o perdidos nunca se avisan.
      </p>
    </div>
  );
}

/* ═══════════════════════════ SIDEBAR ════════════════════════════ */

function Sidebar({ view, goTo, leads, syncing, lastSync, me, isOpen, onClose }) {
  const { stages, isClosed } = useStages();
  const isAdmin    = me?.role === 'admin';
  const [isMobile, setIsMobile] = useState(() => typeof window !== 'undefined' && window.innerWidth < 768);

  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  const [dark, setDark] = useState(() => typeof document !== 'undefined' && document.documentElement.classList.contains('dark'));
  const toggleTheme = () => {
    const next = !document.documentElement.classList.contains('dark');
    document.documentElement.classList.toggle('dark', next);
    try { localStorage.setItem('lf_theme', next ? 'dark' : 'light'); } catch {}
    setDark(next);
  };

  const alertCount = leads.filter(l =>
    (isOverdue(l.followUpDate) || isToday(l.followUpDate)) && !isClosed(l.stage)
  ).length;

  const nav = isAdmin
    ? [{ id: 'admin', label: 'Clientes', icon: 'settings' },
        { id: 'wa-templates', label: 'Mensajes WhatsApp', icon: 'whatsapp' },
        { id: 'meta-capi', label: 'API Conversiones Meta', icon: 'broadcast' }]
    : [
        { id: 'dashboard',  label: 'Dashboard',     icon: 'dashboard' },
        { id: 'leads',      label: 'Leads',          icon: 'users' },
        { id: 'pipeline',   label: 'Pipeline',       icon: 'pipeline' },
        { id: 'reports',    label: 'Informes',       icon: 'chart' },
        { id: 'reminders',  label: 'Recordatorios',  icon: 'bell', badge: alertCount },
        { id: 'avisos',     label: 'Avisos',         icon: 'mail' },
      ];

  // Pipeline rápido: columnas abiertas (sin las de "perdido"), tope 6 para no
  // desbordar la barra lateral cuando el cliente tiene muchas columnas.
  const quickStages = stages.filter(s => !s.isLost).slice(0, 6);
  const stageCounts = Object.fromEntries(quickStages.map(s => [s.id, leads.filter(l => l.stage === s.id).length]));
  const hiddenStages = stages.filter(s => !s.isLost).length - quickStages.length;

  const handleNav = id => { goTo(id); onClose && onClose(); };

  return (
    <>
      {/* Mobile backdrop */}
      {isOpen && (
        <div className="fixed inset-0 bg-black/60 z-30 md:hidden" onClick={onClose} />
      )}
      <aside
        className="sidebar-hide no-print bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 h-screen z-40 overflow-hidden transition-transform duration-300"
        style={{
          width: '260px',
          position: isMobile ? 'fixed' : 'sticky',
          top: 0,
          left: 0,
          transform: isMobile && !isOpen ? 'translateX(-260px)' : 'translateX(0)',
        }}>
        {/* Logo */}
        <div className="px-5 py-5 border-b border-slate-700/50">
          <div className="flex items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <div className="flex-shrink-0">
                <img src="/logo.png" alt="LAX Group" style={{height:'40px',width:'auto',display:'block'}} />
              </div>
              <div>
                <div className="font-bold text-white text-base leading-tight">LAX Group CRM</div>
                <div className="text-xs text-slate-400 leading-tight">CRM · Facebook Ads</div>
              </div>
            </div>
            <button onClick={onClose} className="text-slate-500 hover:text-white p-1 rounded md:hidden">✕</button>
          </div>
        </div>

        {/* Nav */}
        <nav className="flex-1 p-3 space-y-1">
          {nav.map(item => (
            <button key={item.id} onClick={() => handleNav(item.id)}
              className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition-all
                ${view === item.id ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-300'}`}>
              <span className="flex items-center gap-2.5">
                <Icon name={item.icon} size={18} />
                {item.label}
              </span>
              {item.badge > 0 && (
                <span className={`text-xs font-bold px-1.5 py-0.5 rounded-full min-w-[20px] text-center
                  ${view === item.id ? 'bg-white/25 text-white' : 'bg-red-700 text-white'}`}>
                  {item.badge}
                </span>
              )}
            </button>
          ))}
        </nav>

        {/* Quick stats — only for clients */}
        {!isAdmin && (
          <div className="p-4 border-t border-slate-700/50">
            <div className="text-xs text-slate-500 uppercase tracking-wide font-semibold mb-3">Pipeline rápido</div>
            <div className="space-y-2">
              {quickStages.map(s => {
                const count = stageCounts[s.id] || 0;
                return (
                  <div key={s.id} className="flex items-center justify-between gap-2">
                    <div className="flex items-center gap-2 min-w-0">
                      <div className="w-2 h-2 rounded-full flex-shrink-0" style={barStyle(s.color)} />
                      <span className="text-xs text-slate-400 truncate">{s.label}</span>
                    </div>
                    <span className="text-xs font-bold text-slate-300">{count}</span>
                  </div>
                );
              })}
              {hiddenStages > 0 && (
                <div className="text-xs text-slate-500 pt-1">+{hiddenStages} columna{hiddenStages === 1 ? '' : 's'} más</div>
              )}
            </div>
          </div>
        )}

        {/* Theme toggle */}
        <div className="px-4 pt-2">
          <button onClick={toggleTheme}
            className="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition-colors">
            <Icon name={dark ? 'sun' : 'moon'} size={16} />
            {dark ? 'Modo claro' : 'Modo oscuro'}
          </button>
        </div>

        {/* User + logout */}
        <div className="px-4 pb-4 space-y-2">
          <div className={`flex items-center gap-2 text-xs px-3 py-2 rounded-lg ${syncing ? 'bg-indigo-900/50 text-indigo-300' : 'bg-slate-800 text-slate-500'}`}>
            <span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${syncing ? 'bg-indigo-400 animate-pulse' : 'bg-emerald-500'}`} />
            <span className="truncate">
              {syncing ? 'Sincronizando...' : lastSync ? `Sync ${lastSync}` : 'Conectando...'}
            </span>
          </div>
          <div className="flex items-center justify-between px-1">
            <span className="text-xs text-slate-500 truncate">
              {me?.name || 'LAX Group CRM'}
              {me?.role === 'admin' && <span className="ml-1 text-indigo-400">· Admin</span>}
            </span>
            <a href="/auth/logout" title="Cerrar sesión"
              className="text-xs text-slate-600 hover:text-red-400 transition-colors px-1.5 py-0.5 rounded hover:bg-slate-800">
              ⎋ Salir
            </a>
          </div>
        </div>
      </aside>
    </>
  );
}

/* Aviso diario de seguimientos por correo: estado + prueba manual */
function FollowupNotifierCard({ showToast }) {
  const [info, setInfo]   = useState(null);
  const [porCliente, setPorCliente] = useState([]);
  const [sending, setSending] = useState(false);

  const load = () => {
    fetch('/admin/followup-preview').then(r => r.json()).then(setInfo).catch(() => {});
    fetch('/admin/notification-settings').then(r => r.json())
      .then(d => setPorCliente(Array.isArray(d) ? d : [])).catch(() => {});
  };
  useEffect(load, []);

  const enviarPrueba = async () => {
    setSending(true);
    try {
      const r = await fetch('/admin/followup-test', { method: 'POST' });
      const d = await r.json();
      showToast(r.ok ? `Correo enviado a ${d.enviadoA}` : (d.error || 'No se pudo enviar'), r.ok ? 'success' : 'error');
    } catch { showToast('Error de conexión', 'error'); }
    setSending(false);
  };

  if (!info) return null;
  const total = (info.totalHoy || 0) + (info.totalVencidos || 0);

  return (
    <div className="bg-white border rounded-2xl p-6 mb-6">
      <div className="flex items-start justify-between gap-4 flex-wrap">
        <div className="min-w-0">
          <h2 className="font-semibold text-slate-700 mb-1">📧 Aviso diario de seguimientos</h2>
          <p className="text-sm text-slate-500">
            Cada día a las <strong>{String(info.hora).padStart(2,'0')}:00</strong> ({info.zona}) recibes en{' '}
            <strong>{info.destinatario}</strong> los leads que toca contactar y los que quedaron vencidos.
          </p>
        </div>
        <button onClick={enviarPrueba} disabled={sending || !info.configurado}
          className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-xl transition-colors disabled:opacity-50 flex-shrink-0">
          {sending ? 'Enviando…' : 'Enviar prueba ahora'}
        </button>
      </div>

      {!info.configurado && (
        <div className="mt-3 text-xs bg-amber-50 border border-amber-200 text-amber-800 rounded-xl px-3 py-2">
          Falta añadir <code className="font-mono">RESEND_API_KEY</code> en las variables de Railway. Hasta entonces no se envía nada.
        </div>
      )}

      <div className="mt-4 flex gap-3 flex-wrap">
        <div className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2">
          <div className="text-xs text-slate-500 font-semibold uppercase tracking-wide">Para hoy</div>
          <div className="text-xl font-bold text-indigo-600">{info.totalHoy}</div>
        </div>
        <div className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2">
          <div className="text-xs text-slate-500 font-semibold uppercase tracking-wide">Vencidos</div>
          <div className={`text-xl font-bold ${info.totalVencidos ? 'text-red-600' : 'text-slate-700'}`}>{info.totalVencidos}</div>
        </div>
      </div>

      {total > 0 && (
        <div className="mt-3 text-xs text-slate-500">
          {info.clientes.map(c => `${c.nombre}: ${c.hoy} hoy${c.vencidos ? ` · ${c.vencidos} vencidos` : ''}`).join('   |   ')}
        </div>
      )}

      {/* Qué clientes tienen su propio aviso activado */}
      {porCliente.length > 0 && (
        <div className="mt-5 pt-4 border-t border-slate-100">
          <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">
            Aviso propio de cada cliente
          </div>
          <div className="space-y-1.5">
            {porCliente.map(c => (
              <div key={c.username} className="flex items-center justify-between gap-3 text-sm">
                <div className="flex items-center gap-2 min-w-0">
                  <span className={`w-2 h-2 rounded-full flex-shrink-0 ${c.enabled ? 'bg-emerald-500' : 'bg-slate-300'}`} />
                  <span className="font-medium text-slate-700 truncate">{c.name}</span>
                </div>
                <div className="text-xs text-slate-500 text-right truncate">
                  {c.enabled
                    ? `${c.emails.join(', ')} · ${String(c.hour).padStart(2,'0')}:00${c.includeOverdue ? ' · con vencidos' : ''}${c.weekdaysOnly ? ' · L-V' : ''}`
                    : 'sin activar'}
                </div>
              </div>
            ))}
          </div>
          <p className="text-xs text-slate-400 mt-2.5">
            Cada cliente lo configura desde <strong>Avisos</strong> en su cuenta. Para hacerlo tú por él, entra con “Ver como”.
          </p>
        </div>
      )}
    </div>
  );
}

function AdminView({ showToast }) {
  const [users,    setUsers]    = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [form,     setForm]     = useState({ username:'', name:'', password:'' });
  const [creating, setCreating] = useState(false);
  const [resetting, setResetting] = useState(null); // username being reset
  const [newPwd,   setNewPwd]   = useState('');
  const [newPwd2,  setNewPwd2]  = useState(''); // confirmation
  const [showPwd,  setShowPwd]  = useState(false);
  const HOST = window.location.origin;

  const load = () => {
    setLoading(true);
    fetch('/admin/users').then(r => r.json()).then(data => { setUsers(data); setLoading(false); });
  };

  useEffect(load, []);

  const setF = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const handleCreate = async e => {
    e.preventDefault();
    if (!form.username || !form.name || !form.password) return;
    setCreating(true);
    const res  = await fetch('/admin/users', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(form) });
    const data = await res.json();
    if (data.ok) {
      showToast(`Usuario "${form.name}" creado`, 'success');
      setForm({ username:'', name:'', password:'' });
      load();
    } else {
      showToast(data.error || 'Error al crear usuario', 'error');
    }
    setCreating(false);
  };

  const handleDelete = async username => {
    if (!confirm(`¿Eliminar al usuario "${username}" y todos sus datos?`)) return;
    const res = await fetch(`/admin/users/${username}`, { method:'DELETE' });
    const data = await res.json();
    if (data.ok) { showToast('Usuario eliminado', 'info'); load(); }
    else showToast(data.error, 'error');
  };

  const handleResetPwd = async username => {
    const pwd = newPwd.trim();
    const pwd2 = newPwd2.trim();
    if (!pwd) { showToast('Escribe una contraseña', 'error'); return; }
    if (pwd.length < 4) { showToast('Mínimo 4 caracteres', 'error'); return; }
    if (pwd !== pwd2) { showToast('Las dos contraseñas no coinciden', 'error'); return; }
    const res  = await fetch(`/admin/users/${username}/reset-password`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ newPassword: pwd }),
    });
    const data = await res.json();
    if (data.ok) {
      showToast(`Contraseña de "${username}" cambiada (${pwd.length} caracteres)`, 'success');
      setResetting(null); setNewPwd(''); setNewPwd2(''); setShowPwd(false);
    } else {
      showToast(data.error || 'Error al cambiar contraseña', 'error');
    }
  };

  const inputCls = "w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400";

  return (
    <div className="p-4 sm:p-6 anim-fade max-w-4xl">
      <div className="mb-6">
        <h1 className="text-2xl font-bold text-slate-800">Panel de Administración</h1>
        <p className="text-sm text-slate-500 mt-0.5">Gestioná los accesos de tus clientes al CRM</p>

      <FollowupNotifierCard showToast={showToast} />

      {/* Create user form */}
      <div className="bg-white border rounded-2xl p-6 mb-6">
        <h2 className="font-semibold text-slate-700 mb-4">➕ Crear nuevo cliente</h2>
        <form onSubmit={handleCreate} className="grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">

            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">Usuario (login)</label>

      {/* 30-day summary */}

          <div className="space-y-3">
            {users.filter(u => u.role === 'client').map(u => {
              const maxVal = Math.max(...users.filter(x => x.role === 'client').map(x => x.leadsLast30 || 0), 1);
              const pct = Math.round(((u.leadsLast30 || 0) / maxVal) * 100);
              return (
                <div key={u.username} className="flex items-center gap-3">
                  <div className="w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold flex-shrink-0">
                    {u.name.charAt(0)}

                  <span className="text-sm font-medium text-slate-700 w-32 truncate">{u.name}</span>
                  <div className="flex-1 bg-slate-100 rounded-full h-2.5 overflow-hidden">
                    <div className="h-full rounded-full bg-indigo-500 transition-all duration-700" style={{ width: `${pct}%` }} />
                  </div>
                  <span className="text-sm font-bold text-slate-700 w-10 text-right">{u.leadsLast30 || 0}</span>
                  <span className="text-xs text-slate-400 w-20">de {u.leadsCount} total</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Users table */}
      <div className="bg-white border rounded-2xl overflow-hidden">
        <div className="px-6 py-4 border-b flex items-center justify-between">
          <h2 className="font-semibold text-slate-700">Clientes activos</h2>
          <span className="text-xs text-slate-400">{users.filter(u => u.role === 'client').length} clientes</span>
        </div>
        {loading ? (
          <div className="py-12 text-center text-slate-400">Cargando...</div>
        ) : (
          <div className="overflow-x-auto">
          <table className="w-full text-sm min-w-[600px]">
            <thead>
              <tr className="bg-slate-50 border-b">
                <th className="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Cliente</th>
                <th className="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Usuario</th>

                <th className="px-5 py-3"></th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {users.map(u => (
                <tr key={u.username} className="hover:bg-slate-50 transition-colors">
                  <td className="px-5 py-3">
                    <div className="flex items-center gap-2.5">
                      <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${u.role==='admin' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'}`}>
                        {u.name.charAt(0)}
                      </div>
                      <div>
                        <div className="font-semibold text-slate-800">{u.name}</div>
                        <div className={`text-xs px-1.5 py-0.5 rounded inline-block mt-0.5 ${u.role==='admin' ? 'bg-indigo-50 text-indigo-600' : 'bg-emerald-50 text-emerald-600'}`}>
                          {u.role === 'admin' ? '⚙ Admin' : '👤 Cliente'}
                        </div>
                      </div>
                    </div>
                  </td>
                  <td className="px-5 py-3 font-mono text-sm text-slate-600">{u.username}</td>
                  <td className="px-5 py-3">
                    <span className="bg-slate-100 text-slate-700 text-xs font-bold px-2.5 py-1 rounded-full">{u.leadsCount}</span>
                  </td>
                  <td className="px-5 py-3">
                    {u.webhookKey ? (
                      <div className="flex items-center gap-2">
                        <code className="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded truncate max-w-52">
                          /api/webhook/{u.webhookKey}
                        </code>
                        <button onClick={() => { navigator.clipboard.writeText(`${HOST}/api/webhook/${u.webhookKey}`); showToast('URL copiada', 'success'); }}
                          className="text-xs text-indigo-600 hover:underline whitespace-nowrap">
                          Copiar
                        </button>
                      </div>
                    ) : <span className="text-slate-400 text-xs">—</span>}
                  </td>
                  <td className="px-5 py-3">
                    <div className="flex items-center gap-2 justify-end">
                      {resetting === u.username ? (
                        <div className="flex gap-1.5 items-center flex-wrap justify-end">
                          <input
                            type={showPwd ? 'text' : 'password'}
                            autoComplete="new-password"
                            value={newPwd}
                            onChange={e => setNewPwd(e.target.value)}
                            placeholder="Nueva contraseña"
                            className="border border-slate-300 rounded-lg px-2 py-1 text-xs w-40 focus:outline-none focus:ring-1 focus:ring-indigo-400" />
                          <input
                            type={showPwd ? 'text' : 'password'}
                            autoComplete="new-password"
                            value={newPwd2}
                            onChange={e => setNewPwd2(e.target.value)}
                            onKeyDown={e => { if (e.key === 'Enter') handleResetPwd(u.username); }}
                            placeholder="Repetir"
                            className={`border rounded-lg px-2 py-1 text-xs w-32 focus:outline-none focus:ring-1 ${newPwd2 && newPwd.trim() !== newPwd2.trim() ? 'border-red-400 focus:ring-red-400' : 'border-slate-300 focus:ring-indigo-400'}`} />
                          <button
                            type="button"
                            onClick={() => setShowPwd(v => !v)}
                            title={showPwd ? 'Ocultar' : 'Mostrar'}
                            className="text-xs text-slate-400 hover:text-slate-700 px-1">
                            {showPwd ? '🙈' : '👁'}
                          </button>
                          <button
                            onClick={() => handleResetPwd(u.username)}
                            disabled={!newPwd.trim() || newPwd.trim() !== newPwd2.trim()}
                            className="text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded hover:bg-amber-200 disabled:opacity-40 disabled:cursor-not-allowed">
                            Guardar
                          </button>
                          <button
                            onClick={() => { setResetting(null); setNewPwd(''); setNewPwd2(''); setShowPwd(false); }}
                            className="text-xs text-slate-400 px-1">✕</button>
                        </div>
                      ) : (
                        <button onClick={() => { setResetting(u.username); setNewPwd(''); setNewPwd2(''); setShowPwd(false); }} className="text-xs text-slate-400 hover:text-amber-600 transition-colors px-2 py-1 rounded hover:bg-amber-50">
                          🔑 Cambiar pwd
                        </button>
                      )}
                      {u.role !== 'admin' && (
                        <button
                          onClick={async () => {
                            const r = await fetch(`/admin/impersonate/${u.username}`, { method: 'POST' });
                            const d = await r.json();
                            if (d.ok) window.location.href = '/';
                            else showToast(d.error || 'No se pudo entrar como cliente', 'error');
                          }}
                          title={`Entrar como ${u.name}`}
                          className="text-xs text-slate-500 hover:text-indigo-700 transition-colors px-2 py-1 rounded hover:bg-indigo-50 font-medium">
                          👁 Ver como
                        </button>
                      )}
                      {u.role !== 'admin' && (
                        <button onClick={() => handleDelete(u.username)} className="text-xs text-slate-300 hover:text-red-500 transition-colors px-2 py-1 rounded hover:bg-red-50">
                          Eliminar
                        </button>
                      )}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>
    </div>
  );
}

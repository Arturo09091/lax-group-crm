function WhatsappTemplatesView({ showToast }) {
  const [data,      setData]      = useState({ default: DEFAULT_WA_TEMPLATE, clients: [] });
  const [drafts,    setDrafts]    = useState({});
  const [appDrafts, setAppDrafts] = useState({}); // username -> 'normal' | 'business'
  const [loading,   setLoading]   = useState(true);
  const [saving,    setSaving]    = useState(null);

  const load = () => {
    setLoading(true);
    fetch('/admin/whatsapp-templates').then(r => r.json()).then(d => {
      const safe = d && Array.isArray(d.clients) ? d : { default: DEFAULT_WA_TEMPLATE, clients: [] };
      setData(safe);
      const dr = {}, ap = {};
      safe.clients.forEach(c => { dr[c.username] = c.template; ap[c.username] = c.waApp === 'business' ? 'business' : 'normal'; });
      setDrafts(dr);
      setAppDrafts(ap);
      setLoading(false);
    }).catch(() => setLoading(false));
  };
  useEffect(load, []);

  const setDraft    = (u, v) => setDrafts(d => ({ ...d, [u]: v }));
  const setAppDraft = (u, v) => setAppDrafts(a => ({ ...a, [u]: v }));
  const preview     = (tpl) => (tpl || '').replace(/\{nombre\}/gi, 'María');

  const save = async (username) => {
    const template = (drafts[username] || '').trim();
    if (!template) { showToast('El mensaje no puede estar vacío', 'error'); return; }
    setSaving(username);
    try {
      const r = await fetch(`/admin/whatsapp-templates/${username}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ template, waApp: appDrafts[username] === 'business' ? 'business' : 'normal' }),
      });
      const d = await r.json();
      showToast(d.ok ? 'Mensaje guardado' : (d.error || 'Error al guardar'), d.ok ? 'success' : 'error');
    } catch { showToast('Error de conexión', 'error'); }
    setSaving(null);
  };

  return (
    <div className="p-4 sm:p-6 anim-fade max-w-4xl">
      <div className="mb-6">
        <h1 className="text-2xl font-bold text-slate-800">Mensajes de WhatsApp</h1>
        <p className="text-sm text-slate-500 mt-0.5">Define el mensaje que se enviará al pulsar el botón de WhatsApp en cada cuenta de cliente.</p>
      </div>

      <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4 mb-5 flex gap-3">
        <span className="text-indigo-600 flex-shrink-0 mt-0.5"><Icon name="whatsapp" size={18} /></span>
        <div className="text-sm text-indigo-900">
          Escribe <code className="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded text-xs">{'{nombre}'}</code> donde quieras que aparezca automáticamente el nombre del lead.
          <div className="text-xs text-indigo-700 mt-1">Por defecto: "{data.default}"</div>
        </div>
      </div>

      {loading ? (
        <div className="text-center py-12 text-slate-400">Cargando…</div>
      ) : data.clients.length === 0 ? (
        <div className="text-center py-12 text-slate-400">No hay clientes todavía.</div>
      ) : (
        <div className="space-y-4">
          {data.clients.map(c => (
            <div key={c.username} className="bg-white border border-slate-200 rounded-xl p-5">
              <div className="flex items-center gap-2.5 mb-3">
                <div className="w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-xs font-bold flex-shrink-0">{c.name.charAt(0)}</div>
                <div>
                  <div className="font-semibold text-slate-800">{c.name}</div>
                  <div className="text-xs text-slate-400 font-mono">{c.username}</div>
                </div>
              </div>

              <div className="mb-3">
                <div className="text-xs font-semibold text-slate-500 mb-1.5">Al pulsar WhatsApp, abrir:</div>
                <div className="inline-flex items-center gap-1 bg-slate-100 rounded-lg p-1">
                  <button type="button" onClick={() => setAppDraft(c.username, 'normal')}
                    className={`px-3 py-1.5 rounded-md text-xs font-semibold transition-colors ${(appDrafts[c.username] || 'normal') === 'normal' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                    WhatsApp normal
                  </button>
                  <button type="button" onClick={() => setAppDraft(c.username, 'business')}
                    className={`px-3 py-1.5 rounded-md text-xs font-semibold transition-colors ${(appDrafts[c.username] || 'normal') === 'business' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                    WhatsApp Business
                  </button>
                </div>
                {(appDrafts[c.username] || 'normal') === 'business' && (
                  <div className="text-xs text-slate-400 mt-1.5">En Android abre WhatsApp Business directo. En iPhone/PC abre el WhatsApp por defecto (limitación de WhatsApp).</div>
                )}
              </div>

              <textarea
                value={drafts[c.username] || ''}
                onChange={e => setDraft(c.username, e.target.value)}
                rows={3}
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white resize-none"
                placeholder={data.default} />
              <div className="mt-2 text-xs text-slate-500">
                Vista previa: <span className="text-slate-700">{preview(drafts[c.username])}</span>
              </div>
              <div className="flex items-center justify-between mt-3">
                <button onClick={() => setDraft(c.username, data.default)}
                  className="text-xs text-slate-400 hover:text-slate-600 transition-colors">Restaurar por defecto</button>
                <button onClick={() => save(c.username)} disabled={saving === c.username}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors disabled:opacity-60 flex items-center gap-1.5">
                  <Icon name="check" size={15} /> {saving === c.username ? 'Guardando…' : 'Guardar'}
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function MetaCapiView({ toast }) {
  const [clients, setClients] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [pixelForms, setPixelForms] = React.useState({});
  const [saving, setSaving] = React.useState({});
  const [testFiring, setTestFiring] = React.useState({});
  React.useEffect(() => { loadAll(); }, []);
  async function loadAll() {
    setLoading(true);
    try {
      const r = await fetch('/admin/meta-config');
      const d = await r.json();
      setClients(d);
      const forms = {};
      d.forEach(c => { forms[c.username] = { pixelId: c.pixelConfig?.pixelId||'', accessToken: c.pixelConfig?.accessToken||'', testCode: c.pixelConfig?.testCode||'' }; });
      setPixelForms(forms);
    } catch { toast&&toast('Error cargando', 'error'); }
    setLoading(false);
  }
  async function savePixel(u) {
    setSaving(s=>({...s,[u]:true}));
    try {
      const f=pixelForms[u]||{};
      const r=await fetch('/admin/meta-config/'+u+'/pixel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pixelId:f.pixelId,accessToken:f.accessToken,testCode:f.testCode})});
      const d=await r.json();
      if(d.ok){toast&&toast('✅ Pixel guardado','success');loadAll();}else toast&&toast(d.error||'Error','error');
    } catch { toast&&toast('Error guardando','error'); }
    setSaving(s=>({...s,[u]:false}));
  }
  async function saveRule(u,sid,ev,en) {
    try {
      const r=await fetch('/admin/meta-config/'+u+'/rule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stageId:sid,metaEvent:ev,enabled:en})});
      const d=await r.json();
      if(d.ok){toast&&toast('✅ Regla guardada','success');loadAll();}else toast&&toast(d.error||'Error','error');
    } catch { toast&&toast('Error','error'); }
  }
  async function delRule(u,sid) {
    try { await fetch('/admin/meta-config/'+u+'/rule/'+sid,{method:'DELETE'}); toast&&toast('Eliminada','success'); loadAll(); } catch {}
  }
  async function testEv(u,ev) {
    const k=u+'_'+ev; setTestFiring(t=>({...t,[k]:true}));
    try {
      const r=await fetch('/admin/meta-config/'+u+'/test-fire',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventName:ev})});
      const d=await r.json();
      if(d.ok) toast&&toast('📡 Evento enviado','success');
      else toast&&toast('Error: '+(d.result?.error?.message||d.error||'?'),'error');
    } catch { toast&&toast('Error','error'); }
    setTestFiring(t=>({...t,[k]:false}));
  }
  const getRule=(rules,sid)=>rules?.find(r=>r.stageId===sid);
  if(loading) return React.createElement('div',{className:'p-8 text-center text-gray-400'},'🔄 Cargando...');
  const E=React.createElement;
  return E('div',{className:'p-4 md:p-6'},
    E('div',{className:'mb-5'},
      E('h1',{className:'text-2xl font-bold text-white'},'\uD83D\uDCE1 API de Conversiones Meta'),
      E('p',{className:'text-gray-400 mt-1 text-sm'},'Configura el Pixel de Meta y asigna eventos a etapas del pipeline. Cuando un lead llegue a esa etapa se dispara el evento automáticamente.')
    ),
    E('div',{className:'flex gap-4 pb-6',style:{overflowX:'auto',minHeight:'60vh'}},
      clients.length===0
        ? E('div',{className:'text-gray-500 p-8'},'No hay clientes creados.')
        : clients.map(c=>E('div',{key:c.username,className:'bg-gray-800 rounded-xl border border-gray-700 flex flex-col',style:{minWidth:'300px',maxWidth:'340px',flexShrink:0}},
          E('div',{className:'bg-gray-700 rounded-t-xl p-3 border-b border-gray-600 flex items-center gap-2'},
            E('div',{className:'w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-sm flex-shrink-0',style:{background:'#0000ff'}},c.name[0].toUpperCase()),
            E('div',{className:'flex-1 min-w-0'},
              E('div',{className:'font-semibold text-white text-sm truncate'},c.name),
              E('div',{className:'text-xs text-gray-400'},'@'+c.username)
            ),
            E('span',{className:'text-xs px-2 py-0.5 rounded-full flex-shrink-0 '+(c.pixelConfig?.pixelId?'bg-green-900 text-green-300':'bg-gray-600 text-gray-400')},
              c.pixelConfig?.pixelId?'✅ Pixel':'Sin pixel')
          ),
          E('div',{className:'p-3 flex flex-col gap-4 flex-1 overflow-y-auto'},
            E('div',null,
              E('h3',{className:'text-xs font-bold text-gray-400 uppercase tracking-wide mb-2'},'📌 Pixel & Token'),
              E('input',{className:'w-full bg-gray-700 border border-gray-600 rounded px-2 py-1.5 text-xs text-white placeholder-gray-500 mb-1.5',placeholder:'Pixel ID',value:pixelForms[c.username]?.pixelId||'',onChange:e=>setPixelForms(f=>({...f,[c.username]:{...f[c.username],pixelId:e.target.value}}))}),
              E('input',{className:'w-full bg-gray-700 border border-gray-600 rounded px-2 py-1.5 text-xs text-white placeholder-gray-500 mb-1.5',placeholder:'Access Token (EAAG...)',type:'password',value:pixelForms[c.username]?.accessToken||'',onChange:e=>setPixelForms(f=>({...f,[c.username]:{...f[c.username],accessToken:e.target.value}}))}),
              E('input',{className:'w-full bg-gray-700 border border-gray-600 rounded px-2 py-1.5 text-xs text-white placeholder-gray-500 mb-2',placeholder:'Test Event Code (opcional)',value:pixelForms[c.username]?.testCode||'',onChange:e=>setPixelForms(f=>({...f,[c.username]:{...f[c.username],testCode:e.target.value}}))}),
              E('button',{className:'w-full py-1.5 rounded text-xs font-semibold '+(saving[c.username]?'bg-gray-600 text-gray-400 cursor-not-allowed':'bg-indigo-600 hover:bg-indigo-700 text-white'),disabled:saving[c.username],onClick:()=>savePixel(c.username)},saving[c.username]?'Guardando...':'💾 Guardar Pixel')
            ),
            E('div',null,
              E('h3',{className:'text-xs font-bold text-gray-400 uppercase tracking-wide mb-2'},'🔀 Etapa → Evento Meta'),
              E('div',{className:'space-y-1.5'},
                                            (function(){
                                              // Columnas reales del cliente (incluidas las que ha creado él)
                                              const known = (c.stageLabels && c.stageLabels.length) ? c.stageLabels : PIPELINE_STAGES_CAPI;
                                              // Reglas cuya columna ya no existe: se listan para poder borrarlas
                                              const orphan = (c.stageRules||[])
                                                .filter(r => !known.some(s => s.id === r.stageId))
                                                .map(r => ({ id: r.stageId, label: '⚠ Columna borrada: ' + r.stageId, orphan: true }));
                                              return [...known, ...orphan];
                                            })().map(st=>{
                  const rule=getRule(c.stageRules,st.id);
                  return E('div',{key:st.id,className:'bg-gray-700 rounded p-2'},
                    E('div',{className:'flex items-center gap-1 mb-1'},
                      E('span',{className:'text-xs text-gray-300 flex-1 truncate font-medium'},st.label),
                      rule&&E('button',{className:'text-xs text-red-500 hover:text-red-400 px-1',onClick:()=>delRule(c.username,st.id)},'✕')
                    ),
                    E('div',{className:'flex gap-1 items-center'},
                      E('select',{className:'flex-1 bg-gray-600 border border-gray-500 rounded px-1.5 py-1 text-xs text-white',value:rule?.metaEvent||'',onChange:e=>{if(e.target.value)saveRule(c.username,st.id,e.target.value,rule?rule.enabled:true);}},
                        E('option',{value:''},'-- Sin evento --'),
                        META_EVENTS.map(ev=>E('option',{key:ev.id,value:ev.id},ev.label))
                      ),
                      rule&&E('button',{className:'text-xs px-1.5 py-1 rounded font-semibold '+(rule.enabled?'bg-green-700 text-green-200':'bg-gray-600 text-gray-400'),onClick:()=>saveRule(c.username,st.id,rule.metaEvent,!rule.enabled)},rule.enabled?'ON':'OFF')
                    ),
                    rule?.metaEvent&&E('button',{className:'mt-1 w-full text-xs py-0.5 rounded bg-gray-600 hover:bg-gray-500 text-gray-300 disabled:opacity-50',disabled:testFiring[c.username+'_'+rule.metaEvent],onClick:()=>testEv(c.username,rule.metaEvent)},testFiring[c.username+'_'+rule.metaEvent]?'Enviando...':'🧪 Test '+rule.metaEvent)
                  );
                })
              )
            )
          )
        ))
    )
  );
}

function App() {
  const [leads,      setLeads]      = useState(loadLeads);
  const [view,       setView]       = useState('dashboard');
  const [modal,      setModal]      = useState(undefined);
  const [toast,      setToast]      = useState(null);
  const [syncing,    setSyncing]    = useState(false);
  const [lastSync,   setLastSync]   = useState(null);
  const [me,         setMe]         = useState(null);
  const [menuOpen,   setMenuOpen]   = useState(false);
  const [appReady,   setAppReady]   = useState(false);
  const [stages,       setStages]       = useState(DEFAULT_STAGES);
  const [stagesLoaded, setStagesLoaded] = useState(false);
  const [waTemplate, setWaTemplate] = useState(DEFAULT_WA_TEMPLATE);
  const [waApp,      setWaApp]      = useState('normal'); // 'normal' | 'business'

  const showToast = (msg, type = 'info') => setToast({ msg, type, id: Date.now() });

  // Fetch current user info (role determines what they see)
  useEffect(() => {
    fetch('/api/me').then(r => r.json()).then(data => {
      if (data.username) {
        setMe(data);
        if (data.role === 'admin') setView('admin');
      }
    }).catch(() => {}).finally(() => setAppReady(true));
  }, []);

  // Etapas del pipeline del cliente (columnas ilimitadas, vienen del servidor)
  useEffect(() => {
    if (me && me.role === 'client') {
      fetch('/api/pipeline-stages')
        .then(r => r.json())
        .then(data => { if (Array.isArray(data) && data.length) setStages(data); })
        .catch(() => {})
        .finally(() => setStagesLoaded(true));
    } else if (me) {
      setStagesLoaded(true);
    }
  }, [me]);

  // Load this client's WhatsApp message template (used by the contact buttons)
  useEffect(() => {
    if (me && me.role === 'client') {
      fetch('/api/whatsapp-template').then(r => r.json()).then(d => {
        if (d && d.template) setWaTemplate(d.template);
        if (d) setWaApp(d.waApp === 'business' ? 'business' : 'normal');
      }).catch(() => {});
    }
  }, [me]);

  // Guarda la lista completa de columnas. Devuelve el resultado para que el
  // modal pueda mostrar el error y NO cerrarse si el servidor lo rechaza.
  const saveStages = async (next) => {
    try {
      const r = await fetch('/api/pipeline-stages', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(next),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) return { ok: false, error: d.error || 'No se pudo guardar', blocked: d.blocked || [] };
      if (Array.isArray(d.stages)) setStages(d.stages);
      return { ok: true, msg: d.deletedRules
        ? `Columnas actualizadas · ${d.deletedRules} regla(s) de Meta eliminada(s)`
        : 'Columnas actualizadas' };
    } catch (e) {
      return { ok: false, error: 'Error de conexión' };
    }
  };

  const stagesCtx = useMemo(() => buildStagesCtx(stages, saveStages), [stages]);


  // Firma ligera de los leads: si no cambia entre syncs, NO tocamos el estado
  // (así el sync de cada 30s no repinta 4.500 filas para nada).
  const lastSigRef = useRef('');

  // Pull leads from server (called on mount + every 30s to catch Make webhook leads)
  const syncFromServer = useCallback(async (silent = false) => {
    if (!silent) setSyncing(true);
    try {
      const serverLeads = await api.getLeads();
      // Guard: si la sesión caducó la API devuelve {error:...} (no un array).
      // Nunca metemos un no-array en el estado → la app no puede romperse.
      if (Array.isArray(serverLeads)) {
        const sig = serverLeads.length + '|' + serverLeads.map(l =>
          l.id+':'+l.stage+':'+(l.value||'')+':'+(l.followUpDate||'')+':'+(l.name||'')+':'+(l.campaign||'')+':'+(l.source||'')+':'+(l.email||'')+':'+(l.phone||'')
        ).join(';');
        if (sig !== lastSigRef.current) {           // solo si algo cambió de verdad
          lastSigRef.current = sig;
          setLeads(serverLeads);
          cacheLeads(serverLeads);
        }
        setLastSync(new Date().toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' }));
      }
    } catch {
      // Server unreachable — stay with cached data
    } finally {
      if (!silent) setSyncing(false);
    }
  }, []);

  useEffect(() => {
    syncFromServer();
    // Solo sincronizamos si la pestaña está visible (no gastamos en segundo plano).
    const interval = setInterval(() => { if (!document.hidden) syncFromServer(true); }, 30000);
    const onVis = () => { if (!document.hidden) syncFromServer(true); };
    document.addEventListener('visibilitychange', onVis);
    return () => { clearInterval(interval); document.removeEventListener('visibilitychange', onVis); };
  }, [syncFromServer]);

  const openEdit   = lead => setModal(lead);
  const closeModal = () => setModal(undefined);

  const handleSave = async lead => {
    const isEdit = leads.some(l => l.id === lead.id);
    // Optimistic UI update
    setLeads(ls => isEdit ? ls.map(l => l.id === lead.id ? lead : l) : [lead, ...ls]);
    cacheLeads(isEdit ? leads.map(l => l.id === lead.id ? lead : l) : [lead, ...leads]);
    showToast(isEdit ? `Lead "${lead.name}" actualizado` : `Lead "${lead.name}" agregado`, 'success');
    closeModal();
    // Persist to server
    try { await api.upsertLead(lead); } catch {}
  };

  // Borrado en dos pasos: SIEMPRE se pide confirmación con un diálogo propio
  // (window.confirm nativo es poco fiable en iOS y a veces ni aparece).
  const [deleteTarget, setDeleteTarget] = useState(null);

  const handleDelete = id => {
    const lead = leads.find(l => l.id === id);
    if (lead) setDeleteTarget(lead);
  };

  const confirmDeleteLead = async () => {
    const lead = deleteTarget;
    if (!lead) return;
    setDeleteTarget(null);
    setLeads(ls => ls.filter(l => l.id !== lead.id));
    cacheLeads(leads.filter(l => l.id !== lead.id));
    try {
      const r = await api.deleteLead(lead.id);
      if (!r || r.error) throw new Error(r && r.error);
      showToast(`Lead "${lead.name}" eliminado`, 'success');
    } catch {
      // El servidor no lo borró → lo restauramos y avisamos (nada de borrados fantasma)
      setLeads(ls => ls.some(l => l.id === lead.id) ? ls : [lead, ...ls]);
      showToast(`No se pudo eliminar "${lead.name}". Inténtalo de nuevo.`, 'error');
    }
  };

  const handleStageChange = async (id, stage) => {
    const updated = leads.map(l => l.id === id ? { ...l, stage } : l);
    setLeads(updated);
    cacheLeads(updated);
    const lead = updated.find(l => l.id === id);
    try { if (lead) await api.updateLead(lead); } catch {}
  };

  const handleImport = async rows => {
    const stageIds = stages.map(s => s.id);
    const entryId  = stagesCtx.entryId;
    const newLeads = rows.map(r => ({
      name: r.name || '',
      phone: r.phone || '',
      email: r.email || '',
      source: r.source || 'Otro',
      campaign: r.campaign || '',
      adSet: r.adSet || '',
      adName: r.adName || '',
      stage: stageIds.includes(r.stage)
        ? r.stage
        : (stages.find(s => s.label.toLowerCase() === String(r.stage || '').toLowerCase())?.id || entryId),
      value: r.value ? Number(r.value) || 0 : 0,
      followUpDate: r.followUpDate || '',
      notes: r.notes || '',
      id: uid(),
      createdAt: todayISO(),
    }));
    setLeads(ls => [...newLeads, ...ls]);
    cacheLeads([...newLeads, ...leads]);
    showToast(`${newLeads.length} leads importados correctamente`, 'success');
    for (const lead of newLeads) {
      try { await api.upsertLead(lead); } catch {}
    }
  };

  const isAdmin    = me?.role === 'admin';
  const commonProps = { leads, onEdit: openEdit, onDelete: handleDelete, onStageChange: handleStageChange, onImport: handleImport, showToast, waTemplate, waApp };

  const viewLabels = { dashboard:'Dashboard', leads:'Leads', pipeline:'Pipeline', reports:'Informes', reminders:'Recordatorios', avisos:'Avisos', admin:'Clientes' };

  // Pantalla de carga mientras se comprueba la sesión Y llegan las columnas del
  // cliente: si no se espera, el tablero pinta las 6 por defecto y da un salto.
  if (!appReady || (me && me.role === 'client' && !stagesLoaded)) return (
    <div className="min-h-screen bg-slate-900 flex items-center justify-center">
      <div className="text-center">
        <img src="/logo.png" alt="LAX Group" style={{height:'80px',width:'auto',display:'block',margin:'0 auto 16px'}} />
        <div className="text-white font-semibold text-lg">LAX Group CRM</div>
        <div className="text-slate-400 text-sm mt-1 animate-pulse">Cargando...</div>
      </div>
    </div>
  );

  return (
    <StagesCtx.Provider value={stagesCtx}>
    <div className="flex flex-col h-screen overflow-hidden">
      {me?.impersonatedBy && (
        <div className="no-print bg-amber-500 text-white px-4 py-2 flex items-center justify-between gap-3 flex-shrink-0 shadow-md z-50">
          <div className="flex items-center gap-2 text-sm min-w-0">
            <span className="text-base flex-shrink-0">👁</span>
            <span className="truncate">
              Viendo como <strong>{me.name}</strong> · admin: <strong>{me.impersonatedBy.name}</strong>
            </span>
          </div>
          <button
            onClick={async () => {
              await fetch('/admin/stop-impersonating', { method: 'POST' });
              window.location.href = '/';
            }}
            className="bg-white text-amber-700 hover:bg-amber-50 text-xs font-bold px-3 py-1.5 rounded-lg transition-colors whitespace-nowrap shadow-sm">
            ← Volver al admin
          </button>
        </div>
      )}
      <div className="flex flex-1 overflow-hidden">
      <Sidebar view={view} goTo={setView} leads={leads} syncing={syncing} lastSync={lastSync} me={me}
        isOpen={menuOpen} onClose={() => setMenuOpen(false)} isMobileLayout={true} />

      {/* This div takes all remaining width — on mobile sidebar is fixed so this div uses full width */}
      <div className="flex-1 flex flex-col overflow-hidden min-w-0">
        {/* Mobile top bar */}
        <div className="no-print md:hidden flex items-center justify-between px-4 py-3 bg-slate-900 text-white flex-shrink-0 shadow-md">
          <button onClick={() => setMenuOpen(true)} className="text-slate-300 hover:text-white p-1 -ml-1">
            <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <div className="flex items-center gap-2">
            <img src="/logo.png" alt="LAX Group" style={{height:'28px',width:'auto',display:'block',flexShrink:0}} />
            <span className="font-semibold text-sm">{viewLabels[view] || 'LAX Group CRM'}</span>
          </div>
          <div className="flex items-center gap-2">
            <div className={`w-2 h-2 rounded-full ${syncing ? 'bg-indigo-400 animate-pulse' : 'bg-emerald-500'}`} />
            <a href="/auth/logout" title="Cerrar sesión"
              className="text-slate-400 hover:text-red-400 transition-colors p-1 rounded-lg hover:bg-slate-800 text-sm leading-none">
              ⎋
            </a>
          </div>
        </div>

      <main className="flex-1 overflow-y-auto bg-slate-50">
        {view === 'admin'     && <AdminView showToast={showToast} />}
        {view === 'meta-capi' && isAdmin && <MetaCapiView toast={toast} />}
        {view === 'wa-templates' && isAdmin && <WhatsappTemplatesView showToast={showToast} />}
        {view === 'dashboard' && !isAdmin && (
          <Dashboard {...commonProps}
            onOpenNew={() => { setView('leads'); setModal(null); }}
            goTo={setView} />
        )}
        {view === 'leads'     && !isAdmin && <LeadsView     {...commonProps} />}
                    {view === 'pipeline'  && !isAdmin && <PipelineView    {...commonProps} />}
        {view === 'reports'   && !isAdmin && <ReportsView   leads={leads} />}
        {view === 'reminders' && !isAdmin && <RemindersView {...commonProps} />}
        {view === 'avisos'    && !isAdmin && <AvisosView leads={leads} showToast={showToast} />}
      </main>

      {/* Modal */}
      {modal !== undefined && (
        <LeadModal lead={modal} onSave={handleSave} onClose={closeModal} />
      )}

      {/* Confirmación de borrado (diálogo propio: fiable en móvil y escritorio) */}
      {deleteTarget && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4"
          onClick={() => setDeleteTarget(null)}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xs p-5" onClick={e => e.stopPropagation()}>
            <div className="flex items-center gap-3 mb-3">
              <div className="w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-lg flex-shrink-0">🗑</div>
              <div className="min-w-0">
                <div className="font-bold text-slate-800">¿Eliminar este lead?</div>
                <div className="text-sm text-slate-500 truncate">{deleteTarget.name}</div>
              </div>
            </div>
            <p className="text-xs text-slate-400 mb-4">Esta acción no se puede deshacer.</p>
            <div className="flex gap-2">
              <button onClick={() => setDeleteTarget(null)}
                className="flex-1 border border-slate-200 text-slate-600 hover:bg-slate-50 font-semibold text-sm py-2.5 rounded-xl transition-colors">
                Cancelar
              </button>
              <button onClick={confirmDeleteLead}
                className="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold text-sm py-2.5 rounded-xl transition-colors">
                Eliminar
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Toast */}
      {toast && (
        <Toast key={toast.id} msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />
      )}
      </div>{/* end flex-1 column */}
      </div>{/* end sidebar+content row */}
    </div>
    </StagesCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
</body>
</html>
